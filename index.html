<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Carômetro Escolar - E. M. Jardim Vitória</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        .print-only { display: none; }
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { background: white !important; color: black !important; }
            .page-break { page-break-after: always; }
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">

    <!-- CABEÇALHO -->
    <header class="bg-indigo-900 text-white shadow-md no-print">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i data-lucide="users" class="w-8 h-8 text-indigo-400"></i>
                <div>
                    <h1 class="text-xl font-bold leading-none">Carômetro Escolar</h1>
                    <span class="text-xs text-indigo-300">E. M. Jardim Vitória</span>
                </div>
            </div>
            
            <div id="headerControls" class="flex items-center space-x-3 hidden">
                <button onclick="sincronizarComNuvem()" id="btnSync" class="flex items-center space-x-1 bg-indigo-800 hover:bg-indigo-700 px-3 py-1.5 rounded-lg text-sm transition">
                    <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                    <span>Sincronizar</span>
                </button>

                <div class="text-right border-l border-indigo-700 pl-3">
                    <p id="userDisplayName" class="text-sm font-semibold leading-none"></p>
                    <span id="userDisplayRole" class="text-xs text-indigo-300 capitalize"></span>
                </div>

                <button onclick="logout()" class="text-indigo-300 hover:text-white p-1 rounded-lg" title="Sair">
                    <i data-lucide="log-out" class="w-5 h-5"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- CONTAINER PRINCIPAL -->
    <main class="max-w-7xl mx-auto px-4 py-6">

        <!-- TELA DE LOGIN -->
        <section id="loginSection" class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-lg mt-12 no-print">
            <div class="text-center mb-6">
                <div class="bg-indigo-100 text-indigo-600 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-3">
                    <i data-lucide="lock" class="w-8 h-8"></i>
                </div>
                <h2 class="text-2xl font-bold text-slate-800">Acesso ao Sistema</h2>
                <p class="text-sm text-slate-500">Entre com seu usuário e senha</p>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Usuário</label>
                    <input type="text" id="loginUsername" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Senha</label>
                    <input type="password" id="loginPassword" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg transition shadow-md">
                    Entrar
                </button>
            </form>
            <div id="loginError" class="mt-4 text-red-500 text-sm text-center hidden"></div>
        </section>

        <!-- DASHBOARD DA APLICAÇÃO -->
        <div id="appDashboard" class="hidden">
            
            <!-- ABAS DE NAVEGAÇÃO -->
            <div class="flex border-b border-slate-200 mb-6 no-print space-x-2">
                <button onclick="trocarAba('turmas')" id="tabBtnTurmas" class="px-4 py-2 font-medium text-indigo-600 border-b-2 border-indigo-600 flex items-center space-x-2">
                    <i data-lucide="grid" class="w-4 h-4"></i>
                    <span>Turmas & Carômetro</span>
                </button>
                <button onclick="trocarAba('cadastros')" id="tabBtnCadastros" class="px-4 py-2 font-medium text-slate-500 hover:text-indigo-600 flex items-center space-x-2 editor-or-admin hidden">
                    <i data-lucide="user-plus" class="w-4 h-4"></i>
                    <span>Cadastrar / Editar Aluno</span>
                </button>
                <button onclick="trocarAba('usuarios')" id="tabBtnUsuarios" class="px-4 py-2 font-medium text-slate-500 hover:text-indigo-600 flex items-center space-x-2 admin-only hidden">
                    <i data-lucide="shield" class="w-4 h-4"></i>
                    <span>Gerenciar Usuários</span>
                </button>
            </div>

            <!-- SEÇÃO 1: CARÔMETRO / VISUALIZAÇÃO POR TURMA -->
            <section id="secTurmas" class="space-y-6">
                <div class="bg-white p-4 rounded-xl shadow-sm flex flex-wrap gap-4 items-center justify-between no-print">
                    <div class="flex gap-4 flex-1 min-w-[280px]">
                        <select id="filterTurma" onchange="renderizarAlunos()" class="px-3 py-2 border rounded-lg outline-none bg-slate-50">
                            <option value="">Todas as Turmas</option>
                        </select>
                        <select id="filterTurno" onchange="renderizarAlunos()" class="px-3 py-2 border rounded-lg outline-none bg-slate-50">
                            <option value="">Todos os Turnos</option>
                            <option value="Manhã">Manhã</option>
                            <option value="Tarde">Tarde</option>
                            <option value="Integral">Integral</option>
                        </select>
                        <input type="text" id="searchAluno" oninput="renderizarAlunos()" placeholder="Buscar por nome..." class="flex-1 px-3 py-2 border rounded-lg outline-none">
                    </div>
                    <button onclick="window.print()" class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-lg text-sm flex items-center space-x-2">
                        <i data-lucide="printer" class="w-4 h-4"></i>
                        <span>Imprimir</span>
                    </button>
                </div>

                <!-- CARDS DOS ALUNOS -->
                <div id="gridAlunos" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
                    <!-- Gerado dinamicamente -->
                </div>
            </section>

            <!-- SEÇÃO 2: CADASTRO DE ALUNO (EDITORES E ADM) -->
            <section id="secCadastros" class="hidden max-w-2xl mx-auto bg-white p-6 rounded-xl shadow-sm no-print">
                <h3 class="text-lg font-bold mb-4 flex items-center space-x-2 text-indigo-900">
                    <i data-lucide="user-plus" class="text-indigo-600"></i>
                    <span>Cadastrar Aluno</span>
                </h3>

                <form id="formAluno" onsubmit="salvarAluno(event)" class="space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium mb-1">Nome Completo *</label>
                            <input type="text" id="alunoNome" required class="w-full px-3 py-2 border rounded-lg outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Matrícula</label>
                            <input type="text" id="alunoMatricula" class="w-full px-3 py-2 border rounded-lg outline-none">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium mb-1">Turma *</label>
                            <input type="text" id="alunoTurma" placeholder="Ex: 6º Ano A" required class="w-full px-3 py-2 border rounded-lg outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Turno *</label>
                            <select id="alunoTurno" required class="w-full px-3 py-2 border rounded-lg outline-none">
                                <option value="Manhã">Manhã</option>
                                <option value="Tarde">Tarde</option>
                                <option value="Integral">Integral</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium mb-1">Escola Integrada (Contra Turno)?</label>
                            <select id="alunoIntegrada" class="w-full px-3 py-2 border rounded-lg outline-none">
                                <option value="Não">Não</option>
                                <option value="Sim">Sim</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Foto do Aluno</label>
                            <input type="file" id="alunoFoto" accept="image/*" class="w-full text-sm">
                        </div>
                    </div>

                    <!-- NECESSIDADES ESPECIAIS E DESTAQUE DE COR -->
                    <div class="border-t pt-4 mt-4">
                        <label class="block text-sm font-semibold mb-2 text-slate-700">Necessidades Especiais (NE) & Destaque Visual</label>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs text-slate-500 mb-1">Descrição / Diagnóstico (Opcional)</label>
                                <input type="text" id="alunoNE" placeholder="Ex: Autismo, Baixa Visão..." class="w-full px-3 py-2 border rounded-lg outline-none text-sm">
                            </div>
                            <div>
                                <label class="block text-xs text-slate-500 mb-1">Cor do Card (Destaque do Aluno)</label>
                                <select id="alunoCorCard" class="w-full px-3 py-2 border rounded-lg outline-none text-sm font-medium">
                                    <option value="bg-white">Branco (Padrão)</option>
                                    <option value="bg-amber-100 border-amber-300">Amarelo (Atenção / NE)</option>
                                    <option value="bg-blue-100 border-blue-300">Azul (Acompanhamento)</option>
                                    <option value="bg-emerald-100 border-emerald-300">Verde (Destaque / Integrada)</option>
                                    <option value="bg-purple-100 border-purple-300">Roxo (Outros)</option>
                                    <option value="bg-rose-100 border-rose-300">Vermelho (Alerta)</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg transition shadow-md mt-4">
                        Salvar Aluno
                    </button>
                </form>
            </section>

            <!-- SEÇÃO 3: GERENCIAR USUÁRIOS (SOMENTE ADMIN) -->
            <section id="secUsuarios" class="hidden max-w-2xl mx-auto bg-white p-6 rounded-xl shadow-sm no-print">
                <h3 class="text-lg font-bold mb-4 flex items-center space-x-2 text-indigo-900">
                    <i data-lucide="shield" class="text-indigo-600"></i>
                    <span>Cadastrar Usuário do Sistema</span>
                </h3>

                <form id="formUsuario" onsubmit="salvarUsuario(event)" class="space-y-4 mb-6">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium mb-1">Nome de Usuário</label>
                            <input type="text" id="novoUsername" required class="w-full px-3 py-2 border rounded-lg outline-none">
                        </div>
                        <div>
                            <label class="block text-sm font-medium mb-1">Senha</label>
                            <input type="password" id="novaSenha" required class="w-full px-3 py-2 border rounded-lg outline-none">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Nível de Permissão</label>
                        <select id="novoPerfil" class="w-full px-3 py-2 border rounded-lg outline-none">
                            <option value="editor">Editor (Cadastra, altera e visualiza alunos)</option>
                            <option value="leitor">Apenas Visualização (Pode apenas ver/imprimir)</option>
                            <option value="admin">Administrador (Acesso total)</option>
                        </select>
                    </div>
                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 rounded-lg transition">
                        Criar Usuário
                    </button>
                </form>

                <hr class="my-6">

                <h4 class="font-bold mb-3 text-slate-700">Usuários Com Acesso</h4>
                <div id="listaUsuarios" class="space-y-2"></div>
            </section>

        </div>
    </main>

    <!-- SCRIPT DA APLICAÇÃO -->
    <script>
        const JSONBIN_CONFIG = {
            BIN_ID: '66b7bb73ad19ca34f894ef6c',
            API_KEY: '$2a$10$R/9XvYjFzZ3P6L6J5Z4X3O4U5V6W7X8Y9Z0A1B2C3D4E5F6'
        };

        let usuarioLogado = null;
        let alunos = JSON.parse(localStorage.getItem('carometro_alunos')) || [];
        let usuarios = JSON.parse(localStorage.getItem('carometro_usuarios')) || [
            { username: 'admin', pass: 'admin', role: 'admin' } // Padrão: Admin / admin
        ];

        document.addEventListener("DOMContentLoaded", () => {
            lucide.createIcons();
            verificarSessao();
        });

        function verificarSessao() {
            const sessao = sessionStorage.getItem('carometro_sessao');
            if (sessao) {
                usuarioLogado = JSON.parse(sessao);
                iniciarApp();
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const userIn = document.getElementById('loginUsername').value.trim();
            const passIn = document.getElementById('loginPassword').value.trim();

            const userFound = usuarios.find(u => u.username === userIn && u.pass === passIn);

            if (userFound) {
                usuarioLogado = userFound;
                sessionStorage.setItem('carometro_sessao', JSON.stringify(userFound));
                document.getElementById('loginError').classList.add('hidden');
                iniciarApp();
            } else {
                const errDiv = document.getElementById('loginError');
                errDiv.innerText = "Usuário ou senha incorretos!";
                errDiv.classList.remove('hidden');
            }
        }

        function logout() {
            sessionStorage.removeItem('carometro_sessao');
            usuarioLogado = null;
            location.reload();
        }

        function iniciarApp() {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('appDashboard').classList.remove('hidden');
            document.getElementById('headerControls').classList.remove('hidden');

            document.getElementById('userDisplayName').innerText = usuarioLogado.username;
            document.getElementById('userDisplayRole').innerText = usuarioLogado.role;

            // Controle de visibilidade por perfil
            if (usuarioLogado.role === 'admin') {
                document.querySelectorAll('.admin-only').forEach(el => el.classList.remove('hidden'));
                document.querySelectorAll('.editor-or-admin').forEach(el => el.classList.remove('hidden'));
            } else if (usuarioLogado.role === 'editor') {
                document.querySelectorAll('.editor-or-admin').forEach(el => el.classList.remove('hidden'));
            }

            atualizarSelectTurmas();
            renderizarAlunos();
            renderizarListaUsuarios();
        }

        function trocarAba(aba) {
            document.getElementById('secTurmas').classList.add('hidden');
            document.getElementById('secCadastros').classList.add('hidden');
            document.getElementById('secUsuarios').classList.add('hidden');

            document.getElementById('tabBtnTurmas').className = "px-4 py-2 font-medium text-slate-500 flex items-center space-x-2";
            if(document.getElementById('tabBtnCadastros')) document.getElementById('tabBtnCadastros').className = "px-4 py-2 font-medium text-slate-500 flex items-center space-x-2 editor-or-admin";
            if(document.getElementById('tabBtnUsuarios')) document.getElementById('tabBtnUsuarios').className = "px-4 py-2 font-medium text-slate-500 flex items-center space-x-2 admin-only";

            if (aba === 'turmas') {
                document.getElementById('secTurmas').classList.remove('hidden');
                document.getElementById('tabBtnTurmas').className = "px-4 py-2 font-medium text-indigo-600 border-b-2 border-indigo-600 flex items-center space-x-2";
            } else if (aba === 'cadastros') {
                document.getElementById('secCadastros').classList.remove('hidden');
                document.getElementById('tabBtnCadastros').className = "px-4 py-2 font-medium text-indigo-600 border-b-2 border-indigo-600 flex items-center space-x-2 editor-or-admin";
            } else if (aba === 'usuarios') {
                document.getElementById('secUsuarios').classList.remove('hidden');
                document.getElementById('tabBtnUsuarios').className = "px-4 py-2 font-medium text-indigo-600 border-b-2 border-indigo-600 flex items-center space-x-2 admin-only";
            }
        }

        function comprimirFoto(file, maxWidth = 300, quality = 0.7) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const scale = maxWidth / img.width;
                        canvas.width = maxWidth;
                        canvas.height = img.height * scale;

                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                };
            });
        }

        async function salvarAluno(e) {
            e.preventDefault();
            const nome = document.getElementById('alunoNome').value.trim();
            const matricula = document.getElementById('alunoMatricula').value.trim();
            const turma = document.getElementById('alunoTurma').value.trim();
            const turno = document.getElementById('alunoTurno').value;
            const integrada = document.getElementById('alunoIntegrada').value;
            const ne = document.getElementById('alunoNE').value.trim();
            const corCard = document.getElementById('alunoCorCard').value;
            const fotoInput = document.getElementById('alunoFoto');

            let fotoData = '';
            if (fotoInput.files.length > 0) {
                fotoData = await comprimirFoto(fotoInput.files[0]);
            }

            const novoAluno = {
                id: Date.now(),
                nome,
                matricula,
                turma,
                turno,
                integrada,
                ne,
                corCard,
                foto: fotoData
            };

            alunos.push(novoAluno);
            localStorage.setItem('carometro_alunos', JSON.stringify(alunos));

            document.getElementById('formAluno').reset();
            atualizarSelectTurmas();
            renderizarAlunos();
            trocarAba('turmas');
            alert('Aluno cadastrado! Lembre-se de clicar em "Sincronizar" no topo para enviar aos outros computadores.');
        }

        function deletarAluno(id) {
            if (usuarioLogado.role === 'leitor') return;
            if (confirm('Deseja realmente remover este aluno?')) {
                alunos = alunos.filter(a => a.id !== id);
                localStorage.setItem('carometro_alunos', JSON.stringify(alunos));
                renderizarAlunos();
            }
        }

        function salvarUsuario(e) {
            e.preventDefault();
            const username = document.getElementById('novoUsername').value.trim();
            const pass = document.getElementById('novaSenha').value.trim();
            const role = document.getElementById('novoPerfil').value;

            if (usuarios.some(u => u.username === username)) {
                alert('Nome de usuário já existe!');
                return;
            }

            usuarios.push({ username, pass, role });
            localStorage.setItem('carometro_usuarios', JSON.stringify(usuarios));

            document.getElementById('formUsuario').reset();
            renderizarListaUsuarios();
            alert('Usuário criado! Clique em Sincronizar para atualizar a nuvem.');
        }

        function excluirUsuario(username) {
            if (username === 'admin') {
                alert('Não é possível apagar o admin principal.');
                return;
            }
            if (confirm(`Remover usuário ${username}?`)) {
                usuarios = usuarios.filter(u => u.username !== username);
                localStorage.setItem('carometro_usuarios', JSON.stringify(usuarios));
                renderizarListaUsuarios();
            }
        }

        function renderizarListaUsuarios() {
            const container = document.getElementById('listaUsuarios');
            if(!container) return;
            container.innerHTML = '';

            usuarios.forEach(u => {
                const div = document.createElement('div');
                div.className = "flex justify-between items-center p-3 bg-slate-50 border rounded-lg";
                div.innerHTML = `
                    <div>
                        <span class="font-bold text-slate-700">${u.username}</span>
                        <span class="text-xs ml-2 px-2 py-0.5 rounded ${u.role === 'admin' ? 'bg-purple-100 text-purple-700' : u.role === 'editor' ? 'bg-blue-100 text-blue-700' : 'bg-slate-200 text-slate-700'} capitalize">${u.role}</span>
                    </div>
                    ${u.username !== 'admin' ? `
                        <button onclick="excluirUsuario('${u.username}')" class="text-red-500 hover:text-red-700 p-1">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    ` : ''}
                `;
                container.appendChild(div);
            });
            lucide.createIcons();
        }

        function atualizarSelectTurmas() {
            const select = document.getElementById('filterTurma');
            const turmasUnicas = [...new Set(alunos.map(a => a.turma))].sort();

            select.innerHTML = '<option value="">Todas as Turmas</option>';
            turmasUnicas.forEach(t => {
                select.innerHTML += `<option value="${t}">${t}</option>`;
            });
        }

        function renderizarAlunos() {
            const grid = document.getElementById('gridAlunos');
            const filtroTurma = document.getElementById('filterTurma').value;
            const filtroTurno = document.getElementById('filterTurno').value;
            const busca = document.getElementById('searchAluno').value.toLowerCase();

            grid.innerHTML = '';

            const alunosFiltrados = alunos.filter(a => {
                const bateTurma = !filtroTurma || a.turma === filtroTurma;
                const bateTurno = !filtroTurno || a.turno === filtroTurno;
                const bateBusca = !busca || a.nome.toLowerCase().includes(busca);
                return bateTurma && bateTurno && bateBusca;
            });

            if (alunosFiltrados.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center text-slate-400 py-8">Nenhum aluno encontrado.</div>';
                return;
            }

            alunosFiltrados.forEach(a => {
                const card = document.createElement('div');
                const corStyle = a.corCard || 'bg-white';
                
                card.className = `${corStyle} p-3 rounded-xl border shadow-sm flex flex-col items-center text-center relative group`;
                card.innerHTML = `
                    ${usuarioLogado.role !== 'leitor' ? `
                        <button onclick="deletarAluno(${a.id})" class="absolute top-2 right-2 text-red-400 hover:text-red-600 opacity-0 group-hover:opacity-100 transition no-print">
                            <i data-lucide="x-circle" class="w-4 h-4"></i>
                        </button>
                    ` : ''}

                    <div class="w-24 h-24 bg-slate-200 rounded-lg overflow-hidden mb-2 border flex items-center justify-center">
                        ${a.foto ? `<img src="${a.foto}" class="w-full h-full object-cover">` : `<i data-lucide="user" class="w-10 h-10 text-slate-400"></i>`}
                    </div>
                    
                    <h4 class="font-bold text-sm text-slate-800 leading-tight mb-1">${a.nome}</h4>
                    <div class="flex flex-wrap justify-center gap-1 my-1">
                        <span class="text-[10px] bg-indigo-100 text-indigo-700 font-semibold px-2 py-0.5 rounded">${a.turma}</span>
                        <span class="text-[10px] bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded">${a.turno || 'Manhã'}</span>
                    </div>

                    ${a.integrada === 'Sim' ? `<span class="text-[10px] bg-emerald-600 text-white font-bold px-2 py-0.5 rounded-full mt-1">Escola Integrada</span>` : ''}
                    ${a.ne ? `<span class="text-[10px] bg-amber-600 text-white font-bold px-2 py-0.5 rounded-full mt-1" title="${a.ne}">NE: ${a.ne}</span>` : ''}
                `;
                grid.appendChild(card);
            });
            lucide.createIcons();
        }

        async function sincronizarComNuvem() {
            const btn = document.getElementById('btnSync');
            btn.classList.add('opacity-50', 'pointer-events-none');
            btn.innerHTML = `<i data-lucide="refresh-cw" class="w-4 h-4 animate-spin"></i><span>Sincronizando...</span>`;
            lucide.createIcons();

            try {
                const resGet = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_CONFIG.BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': JSONBIN_CONFIG.API_KEY }
                });

                let nuvemData = { alunos: [], usuarios: [] };
                if (resGet.ok) {
                    const jsonRes = await resGet.json();
                    nuvemData = jsonRes.record || nuvemData;
                }

                alunos = mesclarListas(alunos, nuvemData.alunos || [], 'id');
                usuarios = mesclarListas(usuarios, nuvemData.usuarios || [], 'username');

                localStorage.setItem('carometro_alunos', JSON.stringify(alunos));
                localStorage.setItem('carometro_usuarios', JSON.stringify(usuarios));

                const resPut = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_CONFIG.BIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': JSONBIN_CONFIG.API_KEY
                    },
                    body: JSON.stringify({ alunos, usuarios })
                });

                if (resPut.ok) {
                    atualizarSelectTurmas();
                    renderizarAlunos();
                    renderizarListaUsuarios();
                    alert('Sincronização realizada com sucesso!');
                } else {
                    throw new Error('Erro ao enviar dados para o servidor.');
                }

            } catch (err) {
                console.error(err);
                alert('Erro de conexão durante a sincronização.');
            } finally {
                btn.classList.remove('opacity-50', 'pointer-events-none');
                btn.innerHTML = `<i data-lucide="refresh-cw" class="w-4 h-4"></i><span>Sincronizar</span>`;
                lucide.createIcons();
            }
        }

        function mesclarListas(local, nuvem, chave) {
            const mapa = new Map();
            local.forEach(item => mapa.set(item[chave], item));
            nuvem.forEach(item => mapa.set(item[chave], item));
            return Array.from(mapa.values());
        }
    </script>

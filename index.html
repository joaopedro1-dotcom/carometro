<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDB - Diário de Bordo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .bg-escola { background: linear-gradient(135deg, #064e3b 0%, #059669 100%); }
        .text-dourado { color: #fbbf24; }
        .border-dourado { border-color: #fbbf24; }
        .cortina-info { transition: transform 0.4s ease; transform: translateY(101%); }
        .card-aluno:hover .cortina-info { transform: translateY(0); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans">

    <!-- TELA 1: LOGIN -->
    <div id="tela-login" class="fixed inset-0 z-[100] flex items-center justify-center bg-escola px-4">
        <div class="bg-white w-full max-w-md rounded-[2.5rem] shadow-2xl overflow-hidden border-t-8 border-dourado">
            <div class="p-10 text-center">
                <div class="w-20 h-20 bg-emerald-100 rounded-3xl flex items-center justify-center mx-auto mb-4 border-2 border-emerald-800 shadow-inner">
                    <i data-lucide="graduation-cap" class="w-12 h-12 text-emerald-800"></i>
                </div>
                <h1 class="text-xs font-black text-emerald-600 uppercase tracking-[0.3em] mb-1">E. M. Jardim Vitória</h1>
                <h2 class="text-3xl font-black text-emerald-900 uppercase tracking-tighter mb-8">Diário de Bordo</h2>
                
                <form onsubmit="handleLogin(event)" class="space-y-4">
                    <input type="text" id="user" placeholder="Usuário (tente 'admin' ou 'professor')" required class="w-full px-5 py-4 bg-slate-50 border-none rounded-2xl focus:ring-2 focus:ring-emerald-600 outline-none">
                    <input type="password" id="pass" placeholder="Senha" required class="w-full px-5 py-4 bg-slate-50 border-none rounded-2xl focus:ring-2 focus:ring-emerald-600 outline-none">
                    <button type="submit" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-black py-4 rounded-2xl shadow-lg transition-all uppercase tracking-widest text-xs">Entrar no Sistema</button>
                </form>
            </div>
        </div>
    </div>

    <!-- TELA 2: LAYOUT DO SISTEMA -->
    <div id="layout-sistema" class="hidden flex flex-col min-h-screen">
        <!-- HEADER -->
        <header class="bg-emerald-900 text-white shadow-xl border-b-4 border-dourado no-print">
            <div class="max-w-[1600px] mx-auto px-6 py-4 flex justify-between items-center">
                <div class="flex items-center gap-4">
                    <i data-lucide="graduation-cap" class="w-8 h-8 text-dourado"></i>
                    <div>
                        <h1 class="text-lg font-black leading-none tracking-tighter uppercase">E. M. Jardim Vitória</h1>
                        <p class="text-[10px] font-bold text-emerald-400 uppercase tracking-[0.2em]">Diário de Bordo</p>
                    </div>
                </div>
                <div class="flex items-center gap-6">
                    <div class="text-right hidden md:block">
                        <p id="role-display" class="text-[10px] font-bold text-emerald-400 uppercase leading-none mb-1">SETOR</p>
                        <p id="nome-usuario-display" class="text-sm font-black text-white uppercase">USUÁRIO</p>
                    </div>
                    <button onclick="location.reload()" class="flex items-center gap-2 bg-red-500/10 hover:bg-red-500 text-red-400 hover:text-white px-4 py-2 rounded-xl transition-all font-bold text-xs uppercase tracking-widest">
                        <span>Sair</span> <i data-lucide="log-out" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- NAVEGAÇÃO POR ABAS -->
        <nav class="bg-white border-b border-slate-200 px-6 no-print">
            <div class="max-w-[1600px] mx-auto flex gap-8">
                <button onclick="mudarAba('turmas')" id="tab-turmas" class="py-4 text-xs font-black uppercase tracking-widest border-b-2 border-emerald-600 text-emerald-700">Todas as Turmas</button>
                <button onclick="mudarAba('integrada')" id="tab-integrada" class="py-4 text-xs font-black uppercase tracking-widest border-b-2 border-transparent text-slate-400 hover:text-emerald-600">Escola Integrada</button>
                <button onclick="mudarAba('desligados')" id="tab-desligados" class="py-4 text-xs font-black uppercase tracking-widest border-b-2 border-transparent text-slate-400 hover:text-emerald-600">Alunos Desligados</button>
                <button onclick="mudarAba('config')" id="tab-config" class="hidden py-4 text-xs font-black uppercase tracking-widest border-b-2 border-transparent text-slate-400 hover:text-emerald-600">Configuração</button>
            </div>
        </nav>

        <!-- CONTEÚDO PRINCIPAL -->
        <main class="flex-1 max-w-[1600px] mx-auto w-full p-6">
            
            <!-- BARRA DE BUSCA E FILTROS (Comum às Turmas e Integrada) -->
            <div id="area-filtros" class="mb-8 flex flex-wrap gap-4 items-center bg-white p-4 rounded-3xl border border-slate-200 shadow-sm">
                <div class="relative flex-1 min-w-[250px]">
                    <i data-lucide="search" class="absolute left-4 top-3 w-4 h-4 text-slate-400"></i>
                    <input type="text" id="buscaNome" placeholder="Buscar aluno por nome..." oninput="filtrarAlunos()"
                        class="w-full pl-10 pr-4 py-2 bg-slate-50 border-none rounded-xl focus:ring-2 focus:ring-emerald-600 outline-none text-sm">
                </div>
                <select id="filtroTurma" onchange="filtrarAlunos()" class="px-4 py-2 bg-slate-50 border-none rounded-xl text-sm focus:ring-2 focus:ring-emerald-600 outline-none">
                    <option value="">Todas as Turmas</option>
                    <option value="101">Turma 101</option>
                    <option value="601">Turma 601</option>
                </select>
                <select id="filtroTurno" onchange="filtrarAlunos()" class="px-4 py-2 bg-slate-50 border-none rounded-xl text-sm focus:ring-2 focus:ring-emerald-600 outline-none">
                    <option value="">Todos os Turnos</option>
                    <option value="Manhã">Manhã</option>
                    <option value="Tarde">Tarde</option>
                </select>
            </div>

            <!-- SEÇÃO: TODAS AS TURMAS / INTEGRADA / DESLIGADOS -->
            <div id="secao-alunos" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
                <!-- Cards renderizados via JavaScript -->
            </div>

            <!-- SEÇÃO: CONFIGURAÇÕES -->
            <div id="secao-config" class="hidden bg-white p-10 rounded-[2.5rem] border-2 border-slate-200">
                <h2 class="text-2xl font-black text-emerald-900 mb-6 uppercase tracking-tighter">Gerenciamento de Usuários</h2>
                <p class="text-slate-500 mb-8 italic">Somente Administradores podem visualizar esta área.</p>
                <!-- O conteúdo da Etapa 4 e 5 entrará aqui -->
                <div class="p-8 border-2 border-dashed border-slate-200 rounded-3xl text-center text-slate-400 font-bold uppercase text-xs">
                    Espaço para cadastro de equipe pedagógica e professores (Etapa 4 e 5)
                </div>
            </div>

        </main>
    </div>

    <script>
        lucide.createIcons();

        let abaAtual = 'turmas';
        let usuarioLogado = { nome: '', role: '' };

        // DADOS FICTÍCIOS PARA TESTE DA ETAPA 3
        const dbAlunos = [
            { id: 1, nome: "MATEUS OLIVEIRA", turma: "601", turno: "Manhã", integrada: false, desligado: false, ne: "oculta", responsavel: "ADRIANA", fone: "31-9999", img: "https://api.dicebear.com/7.x/avataaars/svg?seed=Mateus" },
            { id: 2, nome: "ANA BEATRIZ SANTOS", turma: "101", turno: "Tarde", integrada: true, desligado: false, ne: "tea", responsavel: "ROBERTO", fone: "31-8888", img: "https://api.dicebear.com/7.x/avataaars/svg?seed=Ana" },
            { id: 3, nome: "CARLOS EDUARDO", turma: "601", turno: "Manhã", integrada: true, desligado: false, ne: "padrao", responsavel: "MARTA", fone: "31-7777", img: "https://api.dicebear.com/7.x/avataaars/svg?seed=Carlos" },
            { id: 4, nome: "JULIA ALVES", turma: "101", turno: "Tarde", integrada: false, desligado: true, ne: "padrao", responsavel: "MARIA", fone: "31-6666", img: "https://api.dicebear.com/7.x/avataaars/svg?seed=Julia" }
        ];

        function handleLogin(e) {
            e.preventDefault();
            const user = document.getElementById('user').value.toLowerCase();
            usuarioLogado.nome = user;
            usuarioLogado.role = (user === 'admin') ? 'admin' : 'professor';

            document.getElementById('tela-login').classList.add('hidden');
            document.getElementById('layout-sistema').classList.remove('hidden');
            
            document.getElementById('nome-usuario-display').innerText = usuarioLogado.nome;
            document.getElementById('role-display').innerText = (usuarioLogado.role === 'admin') ? 'Administração Geral' : 'Equipe Pedagógica';

            if(usuarioLogado.role === 'admin') {
                document.getElementById('tab-config').classList.remove('hidden');
            }

            mudarAba('turmas');
        }

        function mudarAba(aba) {
            abaAtual = aba;
            
            // Reset de estilos das abas
            ['turmas', 'integrada', 'desligados', 'config'].forEach(item => {
                const el = document.getElementById('tab-' + item);
                if(el) {
                    el.classList.remove('border-emerald-600', 'text-emerald-700');
                    el.classList.add('border-transparent', 'text-slate-400');
                }
            });

            // Ativa aba selecionada
            const ativa = document.getElementById('tab-' + aba);
            ativa.classList.remove('border-transparent', 'text-slate-400');
            ativa.classList.add('border-emerald-600', 'text-emerald-700');

            // Troca de seções
            if(aba === 'config') {
                document.getElementById('secao-config').classList.remove('hidden');
                document.getElementById('secao-alunos').classList.add('hidden');
                document.getElementById('area-filtros').classList.add('hidden');
            } else {
                document.getElementById('secao-config').classList.add('hidden');
                document.getElementById('secao-alunos').classList.remove('hidden');
                document.getElementById('area-filtros').classList.remove('hidden');
                filtrarAlunos();
            }
        }

        function filtrarAlunos() {
            const busca = document.getElementById('buscaNome').value.toUpperCase();
            const turma = document.getElementById('filtroTurma').value;
            const turno = document.getElementById('filtroTurno').value;
            const grid = document.getElementById('secao-alunos');
            grid.innerHTML = '';

            const neCores = {
                padrao: 'bg-white border-slate-200',
                oculta: 'bg-emerald-100 border-emerald-300',
                tea: 'bg-blue-100 border-blue-300'
            };

            const listaFiltrada = dbAlunos.filter(aluno => {
                const matchNome = aluno.nome.includes(busca);
                const matchTurma = turma === "" || aluno.turma === turma;
                const matchTurno = turno === "" || aluno.turno === turno;
                
                if (abaAtual === 'turmas') return matchNome && matchTurma && matchTurno && !aluno.desligado;
                if (abaAtual === 'integrada') return matchNome && matchTurma && matchTurno && aluno.integrada && !aluno.desligado;
                if (abaAtual === 'desligados') return matchNome && matchTurma && matchTurno && aluno.desligado;
            });

            listaFiltrada.forEach(aluno => {
                const cor = neCores[aluno.ne] || neCores.padrao;
                grid.innerHTML += `
                    <div class="card-aluno relative ${cor} border-2 rounded-[2rem] shadow-sm overflow-hidden h-[380px] cursor-pointer group">
                        <div class="h-full flex flex-col">
                            <div class="h-3/4 overflow-hidden bg-white">
                                <img src="${aluno.img}" class="w-full h-full object-cover">
                            </div>
                            <div class="p-4 bg-white text-center">
                                <h4 class="font-black text-slate-800 text-xs uppercase">${aluno.nome}</h4>
                                <p class="text-slate-400 font-bold text-[9px] uppercase">${aluno.turma} • ${aluno.turno}</p>
                            </div>
                        </div>
                        <!-- Cortina Info (Hover) -->
                        <div class="cortina-info absolute inset-0 bg-emerald-900/95 p-6 flex flex-col justify-center text-white z-30">
                            <p class="text-amber-400 text-[10px] font-black uppercase mb-4 tracking-widest text-center">Prontuário e Contatos</p>
                            <div class="space-y-2 mb-6">
                                <p class="text-[10px]"><strong>Mãe/Pai:</strong> ${aluno.responsavel}</p>
                                <p class="text-[10px]"><strong>Fone:</strong> ${aluno.fone}</p>
                                <p class="text-[10px]"><strong>Escola Integrada:</strong> ${aluno.integrada ? 'SIM' : 'NÃO'}</p>
                            </div>
                            <button class="w-full bg-amber-400 text-emerald-900 font-black py-3 rounded-xl text-[10px] uppercase hover:bg-white transition">Abrir Prontuário</button>
                        </div>
                    </div>
                `;
            });

            if(listaFiltrada.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center p-20 text-slate-400 italic">Nenhum aluno encontrado nesta aba.</div>';
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carômetro Escolar</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Firebase SDKs (v10 HTML Script CDN) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { background: white; color: black; }
            .card-aluno { break-inside: avoid; page-break-inside: avoid; }
        }
        .print-only { display: none; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

    <!-- Configurações do Firebase Integradas -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCvWQzQ-_cpk_H_b8SGxX9So0ka05uWRxQ",
            authDomain: "carometro-escola.firebaseapp.com",
            projectId: "carometro-escola",
            storageBucket: "carometro-escola.firebasestorage.app",
            messagingSenderId: "906506245125",
            appId: "1:906506245125:web:79331da221fd8ed207386c"
        };

        // Inicializa o Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
    </script>

    <!-- NAVEGAÇÃO / CABEÇALHO -->
    <header class="bg-blue-800 text-white shadow-md p-4 no-print">
        <div class="max-w-7xl mx-auto flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <i data-lucide="graduation-cap" class="w-8 h-8"></i>
                <h1 class="text-2xl font-bold">Carômetro Escolar</h1>
            </div>
            
            <div class="flex items-center gap-3">
                <span id="statusConexao" class="flex items-center gap-2 text-xs bg-emerald-600 px-3 py-1 rounded-full text-white font-medium">
                    <span class="w-2 h-2 bg-white rounded-full animate-pulse"></span> Firebase Conectado
                </span>
                
                <button onclick="window.print()" class="bg-blue-700 hover:bg-blue-600 px-3 py-2 rounded-lg flex items-center gap-2 text-sm transition">
                    <i data-lucide="printer" class="w-4 h-4"></i> Imprimir Carômetro
                </button>
                <button onclick="abrirModalAluno()" class="bg-emerald-600 hover:bg-emerald-500 px-3 py-2 rounded-lg flex items-center gap-2 text-sm font-semibold transition">
                    <i data-lucide="user-plus" class="w-4 h-4"></i> Novo Aluno
                </button>
            </div>
        </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="max-w-7xl mx-auto p-4 sm:p-6">
        
        <!-- BARRA DE PESQUISA E FILTROS -->
        <div class="bg-white p-4 rounded-xl shadow-sm mb-6 flex flex-wrap gap-4 items-center justify-between no-print">
            <div class="flex-1 min-w-[240px] relative">
                <i data-lucide="search" class="w-5 h-5 absolute left-3 top-3 text-slate-400"></i>
                <input type="text" id="inputBusca" oninput="filtrarAlunos()" placeholder="Buscar aluno por nome ou matrícula..." class="w-full pl-10 pr-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <div class="flex flex-wrap gap-3">
                <select id="filtroTurma" onchange="filtrarAlunos()" class="border border-slate-300 rounded-lg px-3 py-2 bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <option value="">Todas as Turmas</option>
                </select>

                <select id="filtroStatus" onchange="filtrarAlunos()" class="border border-slate-300 rounded-lg px-3 py-2 bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <option value="ativo">Alunos Ativos</option>
                    <option value="desligado">Alunos Desligados</option>
                    <option value="todos">Todos os Alunos</option>
                </select>
            </div>
        </div>

        <!-- GRID DE ALUNOS -->
        <div id="gridAlunos" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
            <!-- Os cards dos alunos serão renderizados aqui via JavaScript -->
        </div>

        <div id="mensagemVazio" class="hidden text-center py-12 text-slate-500">
            <i data-lucide="users-round" class="w-12 h-12 mx-auto mb-3 opacity-40"></i>
            <p class="text-lg font-medium">Nenhum aluno encontrado com esses filtros.</p>
        </div>
    </main>

    <!-- MODAL CADASTRO / EDIÇÃO DE ALUNO -->
    <div id="modalAluno" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden no-print">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-lg max-h-[90vh] overflow-y-auto p-6">
            <div class="flex justify-between items-center mb-4">
                <h3 id="modalTitulo" class="text-xl font-bold text-slate-800">Novo Aluno</h3>
                <button onclick="fecharModalAluno()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-6 h-6"></i></button>
            </div>

            <form id="formAluno" onsubmit="salvarAluno(event)" class="space-y-4">
                <input type="hidden" id="alunoId">
                
                <div class="flex justify-center mb-4">
                    <div class="relative w-32 h-32 rounded-full overflow-hidden bg-slate-100 border-2 border-slate-300 flex items-center justify-center group">
                        <img id="previewFoto" src="" class="w-full h-full object-cover hidden">
                        <i id="placeholderFoto" data-lucide="camera" class="w-10 h-10 text-slate-400"></i>
                        <input type="file" id="inputFoto" accept="image/*" onchange="processarFoto(event)" class="absolute inset-0 opacity-0 cursor-pointer">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Nome Completo *</label>
                    <input type="text" id="nomeAluno" required class="w-full border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Turma *</label>
                        <input type="text" id="turmaAluno" required placeholder="Ex: 6º Ano A" class="w-full border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Matrícula</label>
                        <input type="text" id="matriculaAluno" class="w-full border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Data de Nascimento</label>
                        <input type="date" id="dataNascimento" class="w-full border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Status</label>
                        <select id="statusAluno" class="w-full border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                            <option value="ativo">Ativo</option>
                            <option value="desligado">Desligado</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Prontuário / Observações</label>
                    <textarea id="prontuarioAluno" rows="3" class="w-full border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Anotações gerais do aluno..."></textarea>
                </div>

                <div class="flex justify-end gap-3 pt-4 border-t">
                    <button type="button" onclick="fecharModalAluno()" class="px-4 py-2 border border-slate-300 rounded-lg text-slate-700 hover:bg-slate-50">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-blue-700 hover:bg-blue-600 text-white rounded-lg font-medium">Salvar Aluno</button>
                </div>
            </form>
        </div>
    </div>

    <!-- SCRIPT DE LÓGICA DO SISTEMA -->
    <script>
        let alunos = [];
        let fotoBase64 = "";

        // ESCUTAR O BANCO FIRESTORE EM TEMPO REAL
        db.collection("alunos").onSnapshot((snapshot) => {
            alunos = snapshot.docs.map(doc => ({
                id: doc.id,
                ...doc.data()
            }));
            
            atualizarFiltroTurmas();
            filtrarAlunos();
        }, (error) => {
            console.error("Erro ao sincronizar com Firebase:", error);
            alert("Erro de conexão ao sincronizar dados.");
        });

        // COMPRESSÃO AUTOMÁTICA DE IMAGENS (Fotos super leves)
        function comprimirFoto(file, maxWidth = 300, quality = 0.5) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const scale = maxWidth / img.width;
                        canvas.width = maxWidth;
                        canvas.height = img.height * scale;

                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                };
            });
        }

        async function processarFoto(event) {
            const file = event.target.files[0];
            if (file) {
                fotoBase64 = await comprimirFoto(file);
                document.getElementById('previewFoto').src = fotoBase64;
                document.getElementById('previewFoto').classList.remove('hidden');
                document.getElementById('placeholderFoto').classList.add('hidden');
            }
        }

        // CARREGAR E RENDERIZAR OS CARDS NA TELA
        function renderizarAlunos(lista) {
            const grid = document.getElementById('gridAlunos');
            const mensagemVazio = document.getElementById('mensagemVazio');
            grid.innerHTML = '';

            if (lista.length === 0) {
                mensagemVazio.classList.remove('hidden');
                return;
            }
            mensagemVazio.classList.add('hidden');

            lista.forEach(aluno => {
                const card = document.createElement('div');
                card.className = "card-aluno bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col justify-between hover:shadow-md transition";
                
                card.innerHTML = `
                    <div class="p-3 text-center">
                        <div class="w-24 h-24 mx-auto rounded-full overflow-hidden bg-slate-100 border border-slate-200 mb-2">
                            ${aluno.foto ? `<img src="${aluno.foto}" class="w-full h-full object-cover">` : `<div class="w-full h-full flex items-center justify-center text-slate-400"><i data-lucide="user" class="w-12 h-12"></i></div>`}
                        </div>
                        <h4 class="font-bold text-slate-800 text-sm line-clamp-2">${aluno.nome}</h4>
                        <p class="text-xs text-blue-600 font-semibold mt-1">${aluno.turma}</p>
                        ${aluno.matricula ? `<p class="text-[10px] text-slate-400">Matrícula: ${aluno.matricula}</p>` : ''}
                        <span class="inline-block mt-2 text-[10px] px-2 py-0.5 rounded-full ${aluno.status === 'desligado' ? 'bg-red-100 text-red-700' : 'bg-emerald-100 text-emerald-700'}">
                            ${aluno.status === 'desligado' ? 'Desligado' : 'Ativo'}
                        </span>
                    </div>
                    <div class="bg-slate-50 p-2 border-t border-slate-100 flex justify-around no-print">
                        <button onclick="editarAluno('${aluno.id}')" class="text-slate-600 hover:text-blue-600 p-1"><i data-lucide="edit-3" class="w-4 h-4"></i></button>
                        <button onclick="excluirAluno('${aluno.id}')" class="text-slate-600 hover:text-red-600 p-1"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </div>
                `;
                grid.appendChild(card);
            });

            lucide.createIcons();
        }

        // SALVAR NO FIREBASE (INSERIR OU EDITAR)
        async function salvarAluno(e) {
            e.preventDefault();
            
            const id = document.getElementById('alunoId').value;
            const dadosAluno = {
                nome: document.getElementById('nomeAluno').value,
                turma: document.getElementById('turmaAluno').value,
                matricula: document.getElementById('matriculaAluno').value,
                dataNascimento: document.getElementById('dataNascimento').value,
                status: document.getElementById('statusAluno').value,
                prontuario: document.getElementById('prontuarioAluno').value,
                foto: fotoBase64,
                atualizadoEm: new Date()
            };

            try {
                if (id) {
                    await db.collection("alunos").doc(id).update(dadosAluno);
                } else {
                    await db.collection("alunos").add(dadosAluno);
                }
                fecharModalAluno();
            } catch (err) {
                console.error("Erro ao salvar:", err);
                alert("Falha ao salvar o aluno na nuvem.");
            }
        }

        // EXCLUIR ALUNO
        async function excluirAluno(id) {
            if (confirm("Tem certeza que deseja remover este aluno?")) {
                try {
                    await db.collection("alunos").doc(id).delete();
                } catch (err) {
                    alert("Erro ao excluir aluno.");
                }
            }
        }

        // FILTROS DE PESQUISA E TURMAS
        function filtrarAlunos() {
            const busca = document.getElementById('inputBusca').value.toLowerCase();
            const turma = document.getElementById('filtroTurma').value;
            const status = document.getElementById('filtroStatus').value;

            const filtrados = alunos.filter(a => {
                const bateNome = a.nome.toLowerCase().includes(busca) || (a.matricula && a.matricula.includes(busca));
                const bateTurma = turma === "" || a.turma === turma;
                const bateStatus = status === "todos" || a.status === status;

                return bateNome && bateTurma && bateStatus;
            });

            renderizarAlunos(filtrados);
        }

        function atualizarFiltroTurmas() {
            const select = document.getElementById('filtroTurma');
            const valorAtual = select.value;
            const turmas = [...new Set(alunos.map(a => a.turma))].sort();

            select.innerHTML = '<option value="">Todas as Turmas</option>';
            turmas.forEach(t => {
                if(t) {
                    const opt = document.createElement('option');
                    opt.value = t;
                    opt.textContent = t;
                    select.appendChild(opt);
                }
            });
            select.value = valorAtual;
        }

        // CONTROLADORES DO MODAL
        function abrirModalAluno() {
            document.getElementById('formAluno').reset();
            document.getElementById('alunoId').value = '';
            fotoBase64 = '';
            document.getElementById('previewFoto').classList.add('hidden');
            document.getElementById('placeholderFoto').classList.remove('hidden');
            document.getElementById('modalTitulo').innerText = 'Novo Aluno';
            document.getElementById('modalAluno').classList.remove('hidden');
        }

        function fecharModalAluno() {
            document.getElementById('modalAluno').classList.add('hidden');
        }

        function editarAluno(id) {
            const aluno = alunos.find(a => a.id === id);
            if (!aluno) return;

            document.getElementById('alunoId').value = aluno.id;
            document.getElementById('nomeAluno').value = aluno.nome;
            document.getElementById('turmaAluno').value = aluno.turma;
            document.getElementById('matriculaAluno').value = aluno.matricula || '';
            document.getElementById('dataNascimento').value = aluno.dataNascimento || '';
            document.getElementById('statusAluno').value = aluno.status || 'ativo';
            document.getElementById('prontuarioAluno').value = aluno.prontuario || '';

            fotoBase64 = aluno.foto || '';
            if (fotoBase64) {
                document.getElementById('previewFoto').src = fotoBase64;
                document.getElementById('previewFoto').classList.remove('hidden');
                document.getElementById('placeholderFoto').classList.add('hidden');
            } else {
                document.getElementById('previewFoto').classList.add('hidden');
                document.getElementById('placeholderFoto').classList.remove('hidden');
            }

            document.getElementById('modalTitulo').innerText = 'Editar Aluno';
            document.getElementById('modalAluno').classList.remove('hidden');
        }

        lucide.createIcons();
    </script>
</body>
</html>

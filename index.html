<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carômetro Escolar - Jardim Vitória</title>

    <!-- CONFIGURAÇÃO DO APP E ÍCONE -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Carômetro">
    <meta name="theme-color" content="#0d5c3a">
    
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="favicon.svg">

    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 0; }
        :root { --verde: #0d5c3a; --verde-escuro: #073823; --dourado: #d4af37; --fundo: #f4f7f5; }
        body { background: var(--fundo); color: #333; min-height: 100vh; }

        /* TELA DE LOGIN */
        #tela-login { display: flex; justify-content: center; align-items: center; height: 100vh; background: linear-gradient(135deg, var(--verde-escuro), var(--verde)); }
        .box-login { background: white; padding: 30px; border-radius: 12px; border-top: 5px solid var(--dourado); width: 90%; max-width: 380px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .logo-svg { width: 80px; height: 80px; margin-bottom: 10px; }

        .campo { margin-bottom: 15px; text-align: left; }
        .campo label { display: block; font-size: 12px; font-weight: bold; color: var(--verde); margin-bottom: 5px; }
        .campo input, .campo select, .campo textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        .campo-inline { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
        .campo-inline input { width: auto; cursor: pointer; }

        .btn { width: 100%; padding: 12px; background: var(--dourado); color: white; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; font-size: 15px; }
        .btn:hover { background: #b89528; }
        .btn-secundario { background: var(--verde); }
        .btn-secundario:hover { background: var(--verde-escuro); }

        /* PAINEL */
        #painel { display: none; }
        header { background: var(--verde); color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 4px solid var(--dourado); }
        .header-logo { display: flex; align-items: center; gap: 12px; }
        .header-logo .logo-svg { width: 45px; height: 45px; margin: 0; }

        .conteudo { max-width: 1200px; margin: 20px auto; padding: 0 15px; }
        .barra-top { background: white; padding: 15px; border-radius: 8px; display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .busca { flex: 1; min-width: 180px; }

        /* GRID DOS CARDS */
        .grid-alunos { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
        
        /* CARD PADRÃO */
        .card-aluno { background: white; border-radius: 10px; padding: 15px; text-align: center; border-top: 4px solid var(--verde); position: relative; box-shadow: 0 2px 8px rgba(0,0,0,0.06); transition: transform 0.2s; }
        .card-aluno:hover { transform: translateY(-4px); border-top-color: var(--dourado); }
        
        /* ESTILO PARA ALUNO PcD */
        .card-aluno.aluno-pcd {
            background-color: #fff9e6;
            border: 2px solid var(--dourado);
            border-top: 5px solid var(--dourado);
        }

        .foto-aluno { width: 90px; height: 90px; border-radius: 50%; border: 3px solid var(--dourado); object-fit: cover; margin-bottom: 10px; }
        .turma-tag { background: #eaf4ee; color: var(--verde); font-size: 11px; font-weight: bold; padding: 4px 8px; border-radius: 12px; display: inline-block; margin: 3px 2px; }
        .tag-pcd { background: #ffe8a1; color: #8a6d0b; border: 1px solid #d4af37; }
        .tag-integrada { background: #e3f2fd; color: #0d47a1; }

        .box-obs-aluno {
            background: #f8f9fa;
            border-left: 3px solid var(--verde);
            padding: 8px;
            margin-top: 10px;
            border-radius: 4px;
            font-size: 12px;
            text-align: left;
            color: #444;
            max-height: 80px;
            overflow-y: auto;
        }

        .acoes-card { display: flex; gap: 5px; margin-top: 10px; justify-content: center; }
        .btn-sm { padding: 5px 10px; font-size: 12px; border-radius: 4px; border: none; cursor: pointer; color: white; font-weight: bold; }
        .btn-edit { background: #007bff; }
        .btn-del { background: #dc3545; }

        .detalhes-hover { display: none; position: absolute; top: 100%; left: 50%; transform: translateX(-50%); width: 240px; background: var(--verde-escuro); color: white; padding: 12px; border-radius: 8px; z-index: 10; font-size: 12px; text-align: left; border: 1px solid var(--dourado); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .card-aluno:hover .detalhes-hover { display: block; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; font-size: 14px; }
        th { background: var(--verde); color: white; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 100; }
        .modal-box { background: white; padding: 25px; border-radius: 8px; width: 90%; max-width: 450px; border-top: 5px solid var(--dourado); max-height: 90vh; overflow-y: auto; }
    </style>
</head>
<body>

    <svg id="svgTemplate" style="display:none;">
        <g id="logo-icon">
            <circle cx="50" cy="50" r="48" fill="#0d5c3a" stroke="#d4af37" stroke-width="4"/>
            <path d="M50 20 L80 40 L80 70 L50 90 L20 70 L20 40 Z" fill="none" stroke="#d4af37" stroke-width="3"/>
            <text x="50" y="58" font-family="Arial" font-size="22" fill="#ffffff" font-weight="bold" text-anchor="middle">JV</text>
        </g>
    </svg>

    <!-- TELA DE LOGIN -->
    <div id="tela-login">
        <div class="box-login">
            <svg class="logo-svg" viewBox="0 0 100 100"><use href="#logo-icon"/></svg>
            <h2 style="color: var(--verde); margin-bottom: 2px;">Jardim Vitória</h2>
            <p style="color: #666; font-size: 13px; margin-bottom: 20px;">Carômetro & Consulta</p>
            
            <form onsubmit="realizarLogin(event)">
                <div class="campo">
                    <label>USUÁRIO</label>
                    <input type="text" id="userInput" placeholder="Digite seu usuário..." required>
                </div>
                <div class="campo">
                    <label>SENHA</label>
                    <input type="password" id="passInput" placeholder="Digite sua senha..." required>
                </div>
                <button type="submit" class="btn">Entrar no Sistema</button>
            </form>
            <p id="erro" style="color:red; font-size:12px; margin-top:10px; display:none;"></p>
        </div>
    </div>

    <!-- PAINEL PRINCIPAL -->
    <div id="painel">
        <header>
            <div class="header-logo">
                <svg class="logo-svg" viewBox="0 0 100 100"><use href="#logo-icon"/></svg>
                <div>
                    <h3 style="font-size:16px;">ESCOLA MUNICIPAL JARDIM VITÓRIA</h3>
                    <small id="txtPerfil" style="color: var(--dourado);"></small>
                </div>
            </div>
            <div>
                <button id="btnGerenciarUsers" onclick="abrirModalUsers()" style="display:none; background:var(--dourado); border:none; color:white; padding:6px 12px; border-radius:4px; cursor:pointer; font-weight:bold; margin-right:5px;">👥 Usuários</button>
                <button id="btnVirarAno" onclick="avancarAnoLetivo()" style="display:none; background:#28a745; border:none; color:white; padding:6px 12px; border-radius:4px; cursor:pointer; font-weight:bold; margin-right:5px;">📅 Avançar Ano</button>
                <button onclick="sair()" style="background:transparent; border:1px solid var(--dourado); color:var(--dourado); padding:6px 12px; border-radius:4px; cursor:pointer; font-weight:bold;">Sair</button>
            </div>
        </header>

        <div class="conteudo">
            <div class="barra-top">
                <input type="text" id="buscaNome" class="busca campo" style="margin:0;" placeholder="🔍 Buscar por nome..." onkeyup="filtrar()">
                
                <select id="filtroTurma" class="campo" style="margin:0; width:auto;" onchange="filtrar()">
                    <option value="">Todas as Turmas</option>
                    <option value="1º Ano A">1º Ano A</option>
                    <option value="1º Ano B">1º Ano B</option>
                    <option value="2º Ano A">2º Ano A</option>
                    <option value="2º Ano B">2º Ano B</option>
                    <option value="3º Ano A">3º Ano A</option>
                    <option value="3º Ano B">3º Ano B</option>
                    <option value="4º Ano A">4º Ano A</option>
                    <option value="5º Ano A">5º Ano A</option>
                    <option value="Concluído">Alunos Concluídos/Egressos</option>
                </select>

                <select id="filtroProjeto" class="campo" style="margin:0; width:auto;" onchange="filtrar()">
                    <option value="">Todos os Alunos</option>
                    <option value="integrada">☀️ Apenas Educação Integral (Projeto)</option>
                    <option value="pcd">♿ Apenas Alunos PcD/Inclusão</option>
                </select>

                <button id="btnCadastrar" class="btn" style="width:auto; display:none;" onclick="abrirModal()">+ Cadastrar Aluno</button>
                <button class="btn btn-secundario" style="width:auto;" onclick="carregarDadosNuvem()">🔄 Sincronizar</button>
            </div>

            <div class="grid-alunos" id="gridAlunos"></div>
        </div>
    </div>

    <!-- MODAL CADASTRO / EDIÇÃO DE ALUNOS -->
    <div class="modal" id="modalCad">
        <div class="modal-box">
            <h3 id="modalTitulo" style="color: var(--verde); margin-bottom: 15px;">Cadastrar Novo Aluno</h3>
            <form onsubmit="salvarAluno(event)">
                <input type="hidden" id="editIndex">
                <div class="campo"><label>Nome Completo</label><input type="text" id="cadNome" required></div>
                
                <div class="campo">
                    <label>Turma</label>
                    <select id="cadTurma" required>
                        <option value="1º Ano A">1º Ano A</option>
                        <option value="1º Ano B">1º Ano B</option>
                        <option value="2º Ano A">2º Ano A</option>
                        <option value="2º Ano B">2º Ano B</option>
                        <option value="3º Ano A">3º Ano A</option>
                        <option value="3º Ano B">3º Ano B</option>
                        <option value="4º Ano A">4º Ano A</option>
                        <option value="5º Ano A">5º Ano A</option>
                    </select>
                </div>

                <div class="campo-inline">
                    <input type="checkbox" id="cadIntegrada">
                    <label for="cadIntegrada" style="color:#0d47a1; font-weight:bold;">☀️ Participa do Projeto Educação Integral</label>
                </div>

                <div class="campo-inline">
                    <input type="checkbox" id="cadPcd">
                    <label for="cadPcd" style="color:#8a6d0b; font-weight:bold;">♿ Aluno PcD / Necessidade Especial (Destaque Amarelo)</label>
                </div>

                <div class="campo"><label>Foto do Aluno</label><input type="file" id="cadFoto" accept="image/*" onchange="converterFoto(event)"></div>
                <div class="campo"><label>Responsável</label><input type="text" id="cadResp" required></div>
                <div class="campo"><label>Telefone</label><input type="text" id="cadTel" required></div>
                <div class="campo"><label>Alergias / Laudo / Observações</label><textarea id="cadObs" rows="2"></textarea></div>
                
                <div style="display:flex; gap:10px; margin-top:15px;">
                    <button type="button" class="btn" style="background:#ccc;" onclick="fecharModal()">Cancelar</button>
                    <button type="submit" id="btnSalvarModal" class="btn">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL DE GERENCIAMENTO DE USUÁRIOS -->
    <div class="modal" id="modalUsers">
        <div class="modal-box">
            <h3 style="color: var(--verde); margin-bottom: 15px;">Gerenciar Acessos e Usuários</h3>
            
            <form onsubmit="salvarNovoUsuario(event)" style="background:#f9f9f9; padding:12px; border-radius:6px; margin-bottom:15px;">
                <h4 style="font-size:13px; color:var(--verde); margin-bottom:8px;">+ Criar Novo Acesso</h4>
                <div class="campo"><label>Nome de Usuário (login)</label><input type="text" id="novoUser" required placeholder="Ex: maria.silva"></div>
                <div class="campo"><label>Senha</label><input type="password" id="novaSenha" required placeholder="Digite a senha"></div>
                <div class="campo">
                    <label>Permissão</label>
                    <select id="novoPerfil" required>
                        <option value="professor">Professor (Apenas Visualizar/Pesquisar)</option>
                        <option value="admin">Administrador (Total Acesso e Edição)</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-secundario" style="padding:8px;">Criar Usuário</button>
            </form>

            <h4 style="font-size:13px; color:var(--verde);">Usuários Cadastrados</h4>
            <div style="max-height: 180px; overflow-y: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Usuário</th>
                            <th>Perfil</th>
                            <th>Ação</th>
                        </tr>
                    </thead>
                    <tbody id="tabelaUsuarios"></tbody>
                </table>
            </div>

            <div style="margin-top:15px; text-align:right;">
                <button type="button" class="btn" style="background:#ccc; width:auto;" onclick="fecharModalUsers()">Fechar</button>
            </div>
        </div>
    </div>

    <script>
        const BIN_ID = "65c82270dc74654018a287b4";
        const API_KEY = "$2a$10$R90uT8.yZpxfM/m5V.Kk8.vG38.qM2hM5UaBq5yP2b.s43A9r.22S";

        const USUARIOS_PADRAO = [
            { user: "admin", pass: "123", perfil: "admin" },
            { user: "professor", pass: "123", perfil: "professor" }
        ];

        let dadosSistema = {
            alunos: [],
            usuarios: USUARIOS_PADRAO
        };

        let fotoTemp = "";
        let ehAdmin = false;

        function garantirEstruturaDados(dados) {
            if (!dados || typeof dados !== 'object') {
                return { alunos: [], usuarios: USUARIOS_PADRAO };
            }
            if (Array.isArray(dados)) {
                return { alunos: dados, usuarios: USUARIOS_PADRAO };
            }
            if (!Array.isArray(dados.alunos)) {
                dados.alunos = [];
            }
            if (!Array.isArray(dados.usuarios) || dados.usuarios.length === 0) {
                dados.usuarios = USUARIOS_PADRAO;
            }
            return dados;
        }

        // CARREGA DADOS DO LOCALSTORAGE IMEDIATAMENTE
        (function carregarInicialLocal() {
            const dadosLocais = localStorage.getItem('carometro_dados');
            if (dadosLocais) {
                try {
                    dadosSistema = garantirEstruturaDados(JSON.parse(dadosLocais));
                } catch(e){}
            }
        })();

        function realizarLogin(e) {
            e.preventDefault();
            const u = document.getElementById('userInput').value.trim().toLowerCase();
            const p = document.getElementById('passInput').value;

            // Garante leitura atualizada antes de validar
            const dadosLocais = localStorage.getItem('carometro_dados');
            if (dadosLocais) {
                try { dadosSistema = garantirEstruturaDados(JSON.parse(dadosLocais)); } catch(err){}
            }

            const contaEncontrada = dadosSistema.usuarios.find(item => item.user.toLowerCase() === u && item.pass === p);

            if (contaEncontrada) {
                const isAdmin = contaEncontrada.perfil === 'admin';
                const titulo = isAdmin ? 'Administrador / Secretaria' : 'Professor (Consulta)';
                iniciarSessao(titulo, isAdmin);
            } else {
                const err = document.getElementById('erro');
                err.innerText = "Usuário ou senha incorretos!";
                err.style.display = "block";
            }
        }

        function iniciarSessao(perfil, adminFlag) {
            ehAdmin = adminFlag;
            document.getElementById('tela-login').style.display = 'none';
            document.getElementById('painel').style.display = 'block';
            document.getElementById('txtPerfil').innerText = perfil;
            
            if (ehAdmin) {
                document.getElementById('btnCadastrar').style.display = 'block';
                document.getElementById('btnGerenciarUsers').style.display = 'inline-block';
                document.getElementById('btnVirarAno').style.display = 'inline-block';
            }

            renderizar(dadosSistema.alunos);
            carregarDadosNuvem();
        }

        function sair() { location.reload(); }

        function carregarDadosNuvem() {
            fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                headers: { "X-Master-Key": API_KEY }
            })
            .then(res => res.json())
            .then(data => {
                if(data && data.record) {
                    dadosSistema = garantirEstruturaDados(data.record);
                    localStorage.setItem('carometro_dados', JSON.stringify(dadosSistema));
                    renderizar(dadosSistema.alunos);
                }
            })
            .catch(() => { console.log("Modo offline ativo."); });
        }

        function salvarNaNuvem() {
            dadosSistema = garantirEstruturaDados(dadosSistema);
            localStorage.setItem('carometro_dados', JSON.stringify(dadosSistema));
            renderizar(dadosSistema.alunos);

            fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': API_KEY
                },
                body: JSON.stringify(dadosSistema)
            })
            .then(res => res.json())
            .then(res => console.log("Sincronizado na nuvem com sucesso!"))
            .catch(() => { console.log("Salvo apenas localmente."); });
        }

        function converterFoto(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onloadend = () => { fotoTemp = reader.result; };
                reader.readAsDataURL(file);
            }
        }

        function salvarAluno(e) {
            e.preventDefault();
            const index = document.getElementById('editIndex').value;
            const nome = document.getElementById('cadNome').value;
            const fotoPadrao = `https://ui-avatars.com/api/?name=${encodeURIComponent(nome)}&background=0d5c3a&color=fff`;

            const alunoObj = {
                id: index !== "" ? dadosSistema.alunos[index].id : Date.now(),
                nome: nome,
                turma: document.getElementById('cadTurma').value,
                integrada: document.getElementById('cadIntegrada').checked,
                pcd: document.getElementById('cadPcd').checked,
                foto: fotoTemp || (index !== "" ? dadosSistema.alunos[index].foto : fotoPadrao),
                resp: document.getElementById('cadResp').value,
                tel: document.getElementById('cadTel').value,
                obs: document.getElementById('cadObs').value || 'Nenhuma'
            };

            if(index !== "") {
                dadosSistema.alunos[index] = alunoObj;
            } else {
                dadosSistema.alunos.push(alunoObj);
            }

            salvarNaNuvem();
            fecharModal();
            e.target.reset();
            fotoTemp = "";
            document.getElementById('editIndex').value = "";
        }

        function editarAluno(i) {
            const a = dadosSistema.alunos[i];
            document.getElementById('editIndex').value = i;
            document.getElementById('cadNome').value = a.nome;
            document.getElementById('cadTurma').value = a.turma;
            document.getElementById('cadIntegrada').checked = !!a.integrada;
            document.getElementById('cadPcd').checked = !!a.pcd;
            document.getElementById('cadResp').value = a.resp;
            document.getElementById('cadTel').value = a.tel;
            document.getElementById('cadObs').value = a.obs;
            fotoTemp = a.foto;

            document.getElementById('modalTitulo').innerText = "Editar Aluno";
            abrirModal();
        }

        function excluirAluno(i) {
            if(confirm(`Excluir o(a) aluno(a) ${dadosSistema.alunos[i].nome}?`)) {
                dadosSistema.alunos.splice(i, 1);
                salvarNaNuvem();
            }
        }

        function avancarAnoLetivo() {
            if(!confirm("⚠️ DESEJA AVANÇAR O ANO LETIVO DE TODOS OS ALUNOS?\n\n- Alunos do 1º Ano vão para o 2º Ano;\n- Alunos do 2º Ano vão para o 3º Ano;\n- Alunos do 5º Ano passarão para 'Concluído'.")) {
                return;
            }

            const mapaTurmas = {
                "1º Ano A": "2º Ano A",
                "1º Ano B": "2º Ano B",
                "2º Ano A": "3º Ano A",
                "2º Ano B": "3º Ano B",
                "3º Ano A": "4º Ano A",
                "3º Ano B": "4º Ano B",
                "4º Ano A": "5º Ano A",
                "5º Ano A": "Concluído"
            };

            dadosSistema.alunos.forEach(aluno => {
                if(mapaTurmas[aluno.turma]) {
                    aluno.turma = mapaTurmas[aluno.turma];
                }
            });

            salvarNaNuvem();
            alert("Ano letivo avançado com sucesso!");
        }

        function renderizar(alunos) {
            const grid = document.getElementById('gridAlunos');
            grid.innerHTML = '';

            if (!alunos || alunos.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #666;">Nenhum aluno encontrado.</p>';
                return;
            }

            alunos.forEach((aluno, index) => {
                const card = document.createElement('div');
                card.className = `card-aluno ${aluno.pcd ? 'aluno-pcd' : ''}`;
                
                let botoesAdmin = '';
                if(ehAdmin) {
                    botoesAdmin = `
                        <div class="acoes-card">
                            <button class="btn-sm btn-edit" onclick="editarAluno(${index})">Editar</button>
                            <button class="btn-sm btn-del" onclick="excluirAluno(${index})">Excluir</button>
                        </div>
                    `;
                }

                let tagPcd = aluno.pcd ? '<span class="turma-tag tag-pcd">♿ PcD</span>' : '';
                let tagIntegrada = aluno.integrada ? '<span class="turma-tag tag-integrada">☀️ Projeto</span>' : '';
                let textoObs = aluno.obs && aluno.obs !== 'Nenhuma' ? aluno.obs : 'Sem observações';

                card.innerHTML = `
                    <img src="${aluno.foto}" class="foto-aluno" alt="Foto">
                    <br><strong>${aluno.nome}</strong><br>
                    <span class="turma-tag">${aluno.turma}</span>
                    ${tagIntegrada}
                    ${tagPcd}
                    
                    <div class="box-obs-aluno">
                        <strong>📝 Obs:</strong> ${textoObs}
                    </div>

                    ${botoesAdmin}
                    
                    <div class="detalhes-hover">
                        <p><strong>Responsável:</strong> ${aluno.resp}</p>
                        <p><strong>Telefone:</strong> ${aluno.tel}</p>
                        <p><strong>Obs/Laudo:</strong> ${textoObs}</p>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filtrar() {
            const busca = document.getElementById('buscaNome').value.toLowerCase();
            const turma = document.getElementById('filtroTurma').value;
            const projeto = document.getElementById('filtroProjeto').value;

            const filtrados = dadosSistema.alunos.filter(a => {
                const bateuNome = a.nome.toLowerCase().includes(busca);
                const bateuTurma = turma === "" || a.turma === turma;
                
                let bateuProjeto = true;
                if(projeto === 'integrada') bateuProjeto = !!a.integrada;
                if(projeto === 'pcd') bateuProjeto = !!a.pcd;

                return bateuNome && bateuTurma && bateuProjeto;
            });

            renderizar(filtrados);
        }

        /* GERENCIAMENTO DE USUÁRIOS */
        function abrirModalUsers() {
            dadosSistema = garantirEstruturaDados(dadosSistema);
            renderizarTabelaUsuarios();
            document.getElementById('modalUsers').style.display = 'flex';
        }

        function fecharModalUsers() {
            document.getElementById('modalUsers').style.display = 'none';
        }

        function salvarNovoUsuario(e) {
            e.preventDefault();
            const u = document.getElementById('novoUser').value.trim();
            const p = document.getElementById('novaSenha').value.trim();
            const perfil = document.getElementById('novoPerfil').value;

            dadosSistema = garantirEstruturaDados(dadosSistema);

            if(dadosSistema.usuarios.some(x => x.user.toLowerCase() === u.toLowerCase())) {
                alert("Já existe um usuário com esse login!");
                return;
            }

            dadosSistema.usuarios.push({ user: u, pass: p, perfil: perfil });
            
            // Força salvamento
            salvarNaNuvem();
            renderizarTabelaUsuarios();
            
            document.getElementById('novoUser').value = '';
            document.getElementById('novaSenha').value = '';
            
            alert(`Usuário "${u}" criado com sucesso!`);
        }

        function excluirUsuario(index) {
            dadosSistema = garantirEstruturaDados(dadosSistema);
            if(dadosSistema.usuarios[index].user === 'admin') {
                alert("Não é possível apagar o admin principal!");
                return;
            }
            if(confirm(`Deseja excluir o usuário ${dadosSistema.usuarios[index].user}?`)) {
                dadosSistema.usuarios.splice(index, 1);
                salvarNaNuvem();
                renderizarTabelaUsuarios();
            }
        }

        function renderizarTabelaUsuarios() {
            const tbody = document.getElementById('tabelaUsuarios');
            tbody.innerHTML = '';
            dadosSistema = garantirEstruturaDados(dadosSistema);
            dadosSistema.usuarios.forEach((u, i) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${u.user}</strong></td>
                    <td>${u.perfil === 'admin' ? 'Administrador' : 'Professor'}</td>
                    <td><button class="btn-sm btn-del" onclick="excluirUsuario(${i})">Excluir</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function abrirModal() { document.getElementById('modalCad').style.display = 'flex'; }
        function fecharModal() { 
            document.getElementById('modalCad').style.display = 'none'; 
            document.getElementById('editIndex').value = "";
            document.getElementById('cadIntegrada').checked = false;
            document.getElementById('cadPcd').checked = false;
            document.getElementById('modalTitulo').innerText = "Cadastrar Novo Aluno";
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Diário de Bordo - E. M. Jardim Vitória</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        .print-only { display: none; }
        
        /* REGRAS DE IMPRESSÃO */
        @media print {
            body * {
                visibility: hidden !important;
            }
            .no-print { 
                display: none !important; 
            }
            body.imprimindo-prontuario #printProntuarioArea,
            body.imprimindo-prontuario #printProntuarioArea * {
                visibility: visible !important;
            }
            body.imprimindo-prontuario #printProntuarioArea {
                display: block !important;
                position: absolute !important;
                left: 0 !important;
                top: 0 !important;
                width: 100% !important;
                margin: 0 !important;
                padding: 20px !important;
            }
            .page-break { page-break-after: always; }
        }

        /* EFEITO DE HOVER PARA DETALHES */
        .card-aluno .detalhes-aluno {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: all 0.3s ease-in-out;
        }
        .card-aluno:hover .detalhes-aluno {
            max-height: 120px;
            opacity: 1;
            margin-top: 0.75rem;
        }
    </style>
</head>
<body class="bg-emerald-50/40 min-h-screen text-slate-800 font-sans">

    <!-- CABEÇALHO VERDE E DOURADO -->
    <header class="bg-emerald-900 border-b-4 border-amber-400 text-white shadow-lg no-print">
        <div class="max-w-7xl mx-auto px-4 py-3.5 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-amber-400 p-2 rounded-xl text-emerald-950 font-bold shadow-sm">
                    <i data-lucide="users" class="w-7 h-7"></i>
                </div>
                <div>
                    <h1 class="text-xl font-extrabold tracking-wide text-amber-300 uppercase leading-none">Diário de Bordo</h1>
                    <span class="text-xs text-emerald-100 font-medium">Escola Municipal Jardim Vitória</span>
                </div>
            </div>
            
            <div id="headerControls" class="flex items-center space-x-3 hidden">
                <button onclick="carregarDadosNuvem()" id="btnSync" class="flex items-center space-x-1.5 bg-emerald-800 hover:bg-emerald-700 text-amber-300 font-semibold border border-amber-400/40 px-3.5 py-1.5 rounded-lg text-sm transition shadow-sm">
                    <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                    <span>Sincronizar</span>
                </button>

                <div class="text-right border-l border-emerald-700/80 pl-3">
                    <p id="userDisplayName" class="text-sm font-bold text-amber-300 leading-none"></p>
                    <span id="userDisplayRole" class="text-xs text-emerald-200 capitalize"></span>
                </div>

                <button onclick="logout()" class="text-emerald-200 hover:text-amber-300 p-1.5 rounded-lg transition" title="Sair do Sistema">
                    <i data-lucide="log-out" class="w-5 h-5"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- CONTAINER PRINCIPAL -->
    <main class="max-w-7xl mx-auto px-4 py-6 no-print">

        <!-- TELA DE LOGIN -->
        <section id="loginSection" class="max-w-md mx-auto bg-white border border-emerald-100 p-8 rounded-2xl shadow-xl mt-12 no-print">
            <div class="text-center mb-6">
                <div class="bg-emerald-800 text-amber-400 w-16 h-16 rounded-2xl border-2 border-amber-400 flex items-center justify-center mx-auto mb-3 shadow-md">
                    <i data-lucide="lock" class="w-8 h-8"></i>
                </div>
                <h2 class="text-2xl font-black text-emerald-900">Acesso ao Sistema</h2>
                <p class="text-xs text-slate-500 uppercase tracking-wider font-semibold">E. M. Jardim Vitória</p>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-emerald-900 uppercase tracking-wider mb-1">Usuário</label>
                    <input type="text" id="loginUsername" required class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-600 focus:border-emerald-600 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-emerald-900 uppercase tracking-wider mb-1">Senha</label>
                    <input type="password" id="loginPassword" required class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-600 focus:border-emerald-600 outline-none">
                </div>
                <button type="submit" class="w-full bg-emerald-800 hover:bg-emerald-900 text-amber-300 font-bold py-3 rounded-lg transition shadow-md border border-amber-400/30">
                    ENTRAR NO SISTEMA
                </button>
            </form>
            <div id="loginError" class="mt-4 text-rose-600 text-sm text-center font-medium hidden"></div>
        </section>

        <!-- DASHBOARD DA APLICAÇÃO -->
        <div id="appDashboard" class="hidden">
            
            <!-- NAVEGAÇÃO ENTRE ABAS -->
            <div class="flex border-b border-emerald-200 mb-6 no-print space-x-2 overflow-x-auto">
                <button onclick="trocarAba('turmas')" id="tabBtnTurmas" class="px-4 py-2.5 font-bold text-emerald-900 border-b-4 border-amber-400 flex items-center space-x-2 bg-emerald-50 rounded-t-lg whitespace-nowrap">
                    <i data-lucide="grid" class="w-4 h-4 text-emerald-700"></i>
                    <span>Todas as Turmas</span>
                </button>
                <button onclick="trocarAba('integrada')" id="tabBtnIntegrada" class="px-4 py-2.5 font-semibold text-slate-600 hover:text-emerald-900 flex items-center space-x-2 whitespace-nowrap">
                    <i data-lucide="sun" class="w-4 h-4 text-amber-600"></i>
                    <span>Escola Integrada</span>
                </button>
                <button onclick="trocarAba('inativos')" id="tabBtnInativos" class="px-4 py-2.5 font-semibold text-slate-600 hover:text-emerald-900 flex items-center space-x-2 whitespace-nowrap">
                    <i data-lucide="archive" class="w-4 h-4 text-emerald-700"></i>
                    <span>Alunos Desligados</span>
                </button>
                <button onclick="abrirModalCadastro()" id="tabBtnCadastros" class="px-4 py-2.5 font-semibold text-slate-600 hover:text-emerald-900 flex items-center space-x-2 editor-or-admin hidden whitespace-nowrap">
                    <i data-lucide="user-plus" class="w-4 h-4 text-emerald-700"></i>
                    <span>+ Novo Aluno</span>
                </button>
                <button onclick="abrirModalImportacao()" id="tabBtnImportacao" class="px-4 py-2.5 font-semibold text-slate-600 hover:text-emerald-900 flex items-center space-x-2 editor-or-admin hidden whitespace-nowrap">
                    <i data-lucide="file-spreadsheet" class="w-4 h-4 text-emerald-700"></i>
                    <span>+ Importar em Lote</span>
                </button>
                <button onclick="trocarAba('usuarios')" id="tabBtnUsuarios" class="px-4 py-2.5 font-semibold text-slate-600 hover:text-emerald-900 flex items-center space-x-2 admin-only hidden whitespace-nowrap">
                    <i data-lucide="shield" class="w-4 h-4 text-emerald-700"></i>
                    <span>Configurações & Usuários</span>
                </button>
            </div>

            <!-- SEÇÃO 1: TURMAS / CARÔMETRO GERAL -->
            <section id="secTurmas" class="space-y-6">
                <div class="bg-white p-4 rounded-xl border border-emerald-100 shadow-sm flex flex-wrap gap-4 items-center justify-between no-print">
                    <div class="flex gap-4 flex-1 min-w-[280px]">
                        <select id="filterTurma" onchange="renderizarAlunos()" class="px-3 py-2 border rounded-lg outline-none bg-slate-50 text-sm font-medium">
                            <option value="">Todas as Turmas</option>
                        </select>
                        <select id="filterTurno" onchange="renderizarAlunos()" class="px-3 py-2 border rounded-lg outline-none bg-slate-50 text-sm font-medium">
                            <option value="">Todos os Turnos</option>
                            <option value="Manhã">Manhã</option>
                            <option value="Tarde">Tarde</option>
                            <option value="Integral">Integral</option>
                        </select>
                        <input type="text" id="searchAluno" oninput="renderizarAlunos()" placeholder="Buscar aluno por nome..." class="flex-1 px-3 py-2 border rounded-lg outline-none text-sm">
                    </div>
                </div>

                <div id="gridAlunos" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                    <!-- Cards ativos via JS -->
                </div>
            </section>

            <!-- SEÇÃO 1.5: ESCOLA INTEGRADA EXCLUSIVA -->
            <section id="secIntegrada" class="hidden space-y-6">
                <div class="bg-emerald-900 border-l-4 border-amber-400 p-4 rounded-xl text-white shadow-sm flex flex-wrap gap-4 items-center justify-between no-print">
                    <div class="flex items-center space-x-3">
                        <div class="bg-amber-400 p-2 rounded-lg text-emerald-950">
                            <i data-lucide="sun" class="w-6 h-6"></i>
                        </div>
                        <div>
                            <h3 class="font-extrabold text-amber-300 text-base">Alunos da Escola Integrada</h3>
                            <p class="text-xs text-emerald-100">Exibindo apenas alunos cadastrados com participação no projeto.</p>
                        </div>
                    </div>
                </div>

                <div id="gridAlunosIntegrada" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                    <!-- Cards da Escola Integrada via JS -->
                </div>
            </section>

            <!-- SEÇÃO 2: ALUNOS INATIVOS / TRANSFERIDOS -->
            <section id="secInativos" class="hidden space-y-6">
                <div class="bg-amber-50 p-4 rounded-xl border border-amber-200 flex items-center justify-between no-print">
                    <div class="flex items-center space-x-3">
                        <i data-lucide="archive" class="w-6 h-6 text-amber-700"></i>
                        <div>
                            <h3 class="font-bold text-amber-950">Histórico de Alunos Desligados / Transferidos</h3>
                        </div>
                    </div>
                </div>

                <div id="gridAlunosInativos" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 opacity-90">
                    <!-- Cards inativos via JS -->
                </div>
            </section>

            <!-- SEÇÃO 3: GERENCIAR CONFIGURAÇÕES E USUÁRIOS -->
            <section id="secUsuarios" class="hidden max-w-2xl mx-auto space-y-6 no-print">
                <div class="bg-white p-6 rounded-xl border border-emerald-100 shadow-sm">
                    <h3 class="text-lg font-bold mb-4 flex items-center space-x-2 text-emerald-950 pb-2 border-b border-emerald-100">
                        <i data-lucide="shield" class="text-emerald-700"></i>
                        <span>Cadastrar Usuário do Sistema</span>
                    </h3>

                    <form id="formUsuario" onsubmit="salvarUsuario(event)" class="space-y-4 mb-6">
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-bold text-emerald-900 uppercase mb-1">Nome de Usuário</label>
                                <input type="text" id="novoUsername" required class="w-full px-3 py-2 border rounded-lg outline-none text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-emerald-900 uppercase mb-1">Senha</label>
                                <input type="password" id="novaSenha" required class="w-full px-3 py-2 border rounded-lg outline-none text-sm">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-emerald-900 uppercase mb-1">Nível de Permissão</label>
                            <select id="novoPerfil" class="w-full px-3 py-2 border rounded-lg outline-none text-sm">
                                <option value="editor">Editor (Pode incluir e editar alunos)</option>
                                <option value="leitor">Leitor (Apenas visualização e impressão)</option>
                                <option value="admin">Administrador (Acesso total)</option>
                            </select>
                        </div>

                        <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-emerald-950 font-bold py-2.5 rounded-lg transition shadow-md">
                            Criar Novo Usuário
                        </button>
                    </form>
                </div>
            </section>

        </div>
    </main>

    <!-- MODAL POPUP PARA CADASTRO / EDIÇÃO DE ALUNO -->
    <div id="modalAluno" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 z-50 hidden no-print">
        <div class="bg-white rounded-2xl shadow-2xl border border-emerald-100 w-full max-w-xl p-6 relative max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center pb-3 border-b border-slate-200 mb-4">
                <h3 id="modalTitulo" class="text-xl font-black text-emerald-950 flex items-center space-x-2">
                    <i data-lucide="user-cog" class="text-emerald-700"></i>
                    <span id="txtTituloModal">Cadastrar / Editar Aluno</span>
                </h3>
                <button onclick="fecharModalAluno()" class="text-slate-400 hover:text-rose-600 p-1">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>

            <form id="formAluno" onsubmit="salvarAluno(event)" class="space-y-4">
                <input type="hidden" id="alunoId">

                <div>
                    <label class="block text-xs font-bold text-emerald-900 uppercase mb-1">Nome Completo do Aluno *</label>
                    <input type="text" id="alunoNome" required class="w-full px-3 py-2 border rounded-lg outline-none text-sm focus:ring-2 focus:ring-emerald-600">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-emerald-900 uppercase mb-1">Turma *</label>
                        <input type="text" id="alunoTurma" placeholder="Ex: 6º Ano A" required class="w-full px-3 py-2 border rounded-lg outline-none text-sm focus:ring-2 focus:ring-emerald-600">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-emerald-900 uppercase mb-1">Turno *</label>
                        <select id="alunoTurno" required class="w-full px-3 py-2 border rounded-lg outline-none text-sm focus:ring-2 focus:ring-emerald-600">
                            <option value="Manhã">Manhã</option>
                            <option value="Tarde">Tarde</option>
                            <option value="Integral">Integral</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-emerald-900 uppercase mb-1">Nome do Responsável</label>
                        <input type="text" id="alunoResponsavel" placeholder="Ex: Maria das Graças" class="w-full px-3 py-2 border rounded-lg outline-none text-sm focus:ring-2 focus:ring-emerald-600">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-emerald-900 uppercase mb-1">Telefone / WhatsApp</label>
                        <input type="text" id="alunoTelefone" placeholder="(31) 99999-9999" class="w-full px-3 py-2 border rounded-lg outline-none text-sm focus:ring-2 focus:ring-emerald-600">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-emerald-900 uppercase mb-1">Endereço Residencial</label>
                    <input type="text" id="alunoEndereco" placeholder="Rua, Número, Bairro" class="w-full px-3 py-2 border rounded-lg outline-none text-sm focus:ring-2 focus:ring-emerald-600">
                </div>

                <div class="flex space-x-3 pt-3">
                    <button type="button" onclick="fecharModalAluno()" class="w-1/2 bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold py-2.5 rounded-lg transition">
                        Cancelar
                    </button>
                    <button type="submit" id="btnSalvarAluno" class="w-1/2 bg-emerald-800 hover:bg-emerald-900 text-amber-300 font-bold py-2.5 rounded-lg transition shadow-md border border-amber-400/30">
                        Salvar Informações
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- FIREBASE SDKs & LÓGICA DO SISTEMA -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCvWQzQ-_cpk_H_b8SGxX9So0ka05uWRxQ",
            authDomain: "carometro-escola.firebaseapp.com",
            projectId: "carometro-escola",
            storageBucket: "carometro-escola.firebasestorage.app",
            messagingSenderId: "906506245125",
            appId: "1:906506245125:web:79331da221fd8ed207386c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let usuarioLogado = null;
        let alunos = [];
        let usuarios = [];

        window.handleLogin = handleLogin;
        window.logout = logout;
        window.trocarAba = trocarAba;
        window.abrirModalCadastro = abrirModalCadastro;
        window.fecharModalAluno = fecharModalAluno;
        window.renderizarAlunos = renderizarAlunos;
        window.carregarDadosNuvem = carregarDadosNuvem;

        document.addEventListener("DOMContentLoaded", async () => {
            if (window.lucide && typeof window.lucide.createIcons === 'function') {
                try { window.lucide.createIcons(); } catch(e){}
            }
            await carregarDadosNuvem();
            verificarSessao();
        });

        async function carregarDadosNuvem() {
            try {
                const queryAlunos = await getDocs(collection(db, "alunos"));
                alunos = [];
                queryAlunos.forEach((doc) => {
                    alunos.push(doc.data());
                });

                const queryUsuarios = await getDocs(collection(db, "usuarios"));
                usuarios = [];
                queryUsuarios.forEach((doc) => {
                    usuarios.push(doc.data());
                });

                if (usuarioLogado) {
                    renderizarAlunos();
                }
            } catch (error) {
                console.error("Erro ao carregar dados do Firebase:", error);
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById("loginUsername").value;
            const p = document.getElementById("loginPassword").value;

            if ((u === "admin" || u === "ADMIN") && p === "admin") {
                usuarioLogado = { username: "admin", perfil: "admin" };
                localStorage.setItem("sessaoUsuario", JSON.stringify(usuarioLogado));
                exibirDashboard();
                return;
            }

            const user = usuarios.find(usr => usr.username === u && usr.password === p);
            if (user) {
                usuarioLogado = user;
                localStorage.setItem("sessaoUsuario", JSON.stringify(user));
                exibirDashboard();
            } else {
                const err = document.getElementById("loginError");
                err.innerText = "Usuário ou senha incorretos.";
                err.classList.remove("hidden");
            }
        }

        function logout() {
            localStorage.removeItem("sessaoUsuario");
            usuarioLogado = null;
            exibirLogin();
        }

        function verificarSessao() {
            const sessao = localStorage.getItem("sessaoUsuario");
            if (sessao) {
                usuarioLogado = JSON.parse(sessao);
                exibirDashboard();
            } else {
                exibirLogin();
            }
        }

        function exibirLogin() {
            document.getElementById("loginSection").classList.remove("hidden");
            document.getElementById("appDashboard").classList.add("hidden");
            document.getElementById("headerControls").classList.add("hidden");
        }

        function exibirDashboard() {
            document.getElementById("loginSection").classList.add("hidden");
            document.getElementById("appDashboard").classList.remove("hidden");
            document.getElementById("headerControls").classList.remove("hidden");

            document.getElementById("userDisplayName").innerText = usuarioLogado.username;
            document.getElementById("userDisplayRole").innerText = usuarioLogado.perfil;

            document.querySelectorAll('.editor-or-admin').forEach(el => el.classList.remove('hidden'));
            if (usuarioLogado.perfil === 'admin') {
                document.querySelectorAll('.admin-only').forEach(el => el.classList.remove('hidden'));
            }

            if (window.lucide && typeof window.lucide.createIcons === 'function') {
                try { window.lucide.createIcons(); } catch(e){}
            }

            renderizarAlunos();
        }

        function trocarAba(aba) {
            document.getElementById("secTurmas").classList.add("hidden");
            document.getElementById("secIntegrada").classList.add("hidden");
            document.getElementById("secInativos").classList.add("hidden");
            document.getElementById("secUsuarios").classList.add("hidden");

            if (aba === 'turmas') document.getElementById("secTurmas").classList.remove("hidden");
            if (aba === 'integrada') document.getElementById("secIntegrada").classList.remove("hidden");
            if (aba === 'inativos') document.getElementById("secInativos").classList.remove("hidden");
            if (aba === 'usuarios') document.getElementById("secUsuarios").classList.remove("hidden");
        }

        function abrirModalCadastro() {
            document.getElementById("modalAluno").classList.remove("hidden");
        }

        function fecharModalAluno() {
            document.getElementById("modalAluno").classList.add("hidden");
        }

        function renderizarAlunos() {
            const grid = document.getElementById("gridAlunos");
            if (!grid) return;
            grid.innerHTML = "";

            const filtroTurma = document.getElementById("filterTurma") ? document.getElementById("filterTurma").value : "";
            const filtroTurno = document.getElementById("filterTurno") ? document.getElementById("filterTurno").value : "";
            const busca = document.getElementById("searchAluno") ? document.getElementById("searchAluno").value.toLowerCase() : "";

            const alunosFiltrados = alunos.filter(aluno => {
                const ehAtivo = aluno.status === "ativo" || !aluno.status;
                const combinaTurma = !filtroTurma || aluno.turma === filtroTurma;
                const combinaTurno = !filtroTurno || aluno.turno === filtroTurno;
                const combinaBusca = !busca || (aluno.nome && aluno.nome.toLowerCase().includes(busca));
                return ehAtivo && combinaTurma && combinaTurno && combinaBusca;
            });

            if (alunosFiltrados.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-8 text-slate-500 text-sm">Nenhum aluno encontrado.</div>`;
                return;
            }

            alunosFiltrados.forEach(aluno => {
                const card = document.createElement("div");
                card.className = `card-aluno bg-white border border-slate-200 rounded-2xl p-5 shadow-xs hover:shadow-lg transition-all duration-300 flex flex-col items-center text-center cursor-pointer relative overflow-hidden`;
                
                const fotoHtml = aluno.foto 
                    ? `<img src="${aluno.foto}" class="w-24 h-24 rounded-full object-cover shadow-sm mb-3 border-2 border-emerald-100">`
                    : `<div class="w-24 h-24 rounded-full bg-emerald-100 text-emerald-800 font-black flex items-center justify-center text-3xl mb-3 shadow-inner border-2 border-emerald-200">${aluno.nome ? aluno.nome.charAt(0) : 'A'}</div>`;

                const nomeUpper = aluno.nome ? aluno.nome.toUpperCase() : '';

                card.innerHTML = `
                    ${fotoHtml}
                    <h4 class="font-black text-slate-800 text-sm leading-tight tracking-wide uppercase px-2">${nomeUpper}</h4>
                    <span class="text-xs font-semibold text-slate-500 mt-1">${aluno.turma || ''} ${aluno.turno ? `(${aluno.turno})` : ''}</span>

                    <div class="detalhes-aluno w-full text-left border-t border-slate-100 pt-2 text-xs text-slate-600 space-y-1">
                        ${aluno.responsavel ? `<p class="truncate"><span class="font-bold text-slate-700">Resp:</span> ${aluno.responsavel}</p>` : ''}
                        ${aluno.telefone ? `<p><span class="font-bold text-slate-700">Tel:</span> ${aluno.telefone}</p>` : ''}
                        ${aluno.endereco ? `<p class="truncate"><span class="font-bold text-slate-700">End:</span> ${aluno.endereco}</p>` : ''}
                    </div>
                `;
                grid.appendChild(card);
            });
        }
    </script>
</body>
</html>

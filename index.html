<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diário de Bordo - E. M. Jardim Vitória</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @media print {
            body * { visibility: hidden !important; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="bg-emerald-50/40 min-h-screen text-slate-800 font-sans">

    <!-- CABEÇALHO -->
    <header class="bg-emerald-900 border-b-4 border-amber-400 text-white shadow-lg no-print">
        <div class="max-w-7xl mx-auto px-4 py-3.5 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-amber-400 p-2 rounded-xl text-emerald-950 font-bold shadow-sm">
                    <i data-lucide="users" class="w-7 h-7"></i>
                </div>
                <div>
                    <h1 class="text-xl font-extrabold tracking-wide text-amber-300 uppercase leading-none">Diário de Bordo</h1>
                    <span class="text-xs text-emerald-100 font-medium">Escola Municipal Jardim Vitória</span>
                </div>
            </div>
            
            <div id="headerControls" class="flex items-center space-x-3 hidden">
                <button onclick="carregarDadosNuvem()" id="btnSync" class="flex items-center space-x-1.5 bg-emerald-800 hover:bg-emerald-700 text-amber-300 font-semibold border border-amber-400/40 px-3.5 py-1.5 rounded-lg text-sm transition shadow-sm">
                    <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                    <span>Sincronizar</span>
                </button>

                <div class="text-right border-l border-emerald-700/80 pl-3">
                    <p id="userDisplayName" class="text-sm font-bold text-amber-300 leading-none"></p>
                    <span id="userDisplayRole" class="text-xs text-emerald-200 capitalize"></span>
                </div>

                <button onclick="logout()" class="text-emerald-200 hover:text-amber-300 p-1.5 rounded-lg transition" title="Sair do Sistema">
                    <i data-lucide="log-out" class="w-5 h-5"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- CONTAINER PRINCIPAL -->
    <main class="max-w-7xl mx-auto px-4 py-6 no-print">

        <!-- TELA DE LOGIN -->
        <section id="loginSection" class="max-w-md mx-auto bg-white border border-emerald-100 p-8 rounded-2xl shadow-xl mt-12 no-print">
            <div class="text-center mb-6">
                <div class="bg-emerald-800 text-amber-400 w-16 h-16 rounded-2xl border-2 border-amber-400 flex items-center justify-center mx-auto mb-3 shadow-md">
                    <i data-lucide="lock" class="w-8 h-8"></i>
                </div>
                <h2 class="text-2xl font-black text-emerald-900">Acesso ao Sistema</h2>
                <p class="text-xs text-slate-500 uppercase tracking-wider font-semibold">E. M. Jardim Vitória</p>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-emerald-900 uppercase tracking-wider mb-1">Usuário</label>
                    <input type="text" id="loginUsername" required class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-600 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-emerald-900 uppercase tracking-wider mb-1">Senha</label>
                    <input type="password" id="loginPassword" required class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-600 outline-none">
                </div>
                <button type="submit" class="w-full bg-emerald-800 hover:bg-emerald-900 text-amber-300 font-bold py-3 rounded-lg transition shadow-md border border-amber-400/30">
                    ENTRAR NO SISTEMA
                </button>
            </form>
            <div id="loginError" class="mt-4 text-rose-600 text-sm text-center font-medium hidden"></div>
        </section>

        <!-- DASHBOARD DA APLICAÇÃO -->
        <div id="appDashboard" class="hidden">
            
            <div class="flex border-b border-emerald-200 mb-6 no-print space-x-2">
                <button onclick="trocarAba('turmas')" id="tabBtnTurmas" class="px-4 py-2.5 font-bold text-emerald-900 border-b-4 border-amber-400 flex items-center space-x-2 bg-emerald-50 rounded-t-lg">
                    <i data-lucide="grid" class="w-4 h-4 text-emerald-700"></i>
                    <span>Todas as Turmas</span>
                </button>
            </div>

            <!-- FILTROS E IMPORTAÇÃO -->
            <section id="secTurmas" class="space-y-6">
                <div class="bg-white p-4 rounded-xl border border-emerald-100 shadow-sm flex flex-wrap gap-4 items-center justify-between no-print">
                    <div class="flex gap-4 flex-1 min-w-[280px]">
                        <select id="filterTurma" onchange="renderizarAlunos()" class="px-3 py-2 border rounded-lg outline-none bg-slate-50 text-sm font-medium">
                            <option value="">Todas as Turmas</option>
                        </select>
                        <select id="filterTurno" onchange="renderizarAlunos()" class="px-3 py-2 border rounded-lg outline-none bg-slate-50 text-sm font-medium">
                            <option value="">Todos os Turnos</option>
                            <option value="Manhã">Manhã</option>
                            <option value="Tarde">Tarde</option>
                        </select>
                        <input type="text" id="searchAluno" oninput="renderizarAlunos()" placeholder="Buscar aluno por nome..." class="flex-1 px-3 py-2 border rounded-lg outline-none text-sm">
                    </div>
                    
                    <div class="flex items-center space-x-2">
                        <button onclick="abrirModalImportacao()" class="editor-or-admin hidden bg-emerald-700 hover:bg-emerald-800 text-white font-bold px-3.5 py-2 rounded-lg text-sm flex items-center space-x-2 shadow-xs transition">
                            <i data-lucide="file-spreadsheet" class="w-4 h-4 text-amber-300"></i>
                            <span>Importar Planilha (CSV)</span>
                        </button>
                    </div>
                </div>

                <!-- CARDS DOS ALUNOS -->
                <div id="gridAlunos" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
            </section>

        </div>
    </main>

    <!-- MODAL DE IMPORTAÇÃO CSV -->
    <div id="modalImportar" class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 z-50 hidden no-print">
        <div class="bg-white rounded-2xl shadow-2xl border border-emerald-100 w-full max-w-lg p-6 relative">
            <div class="flex justify-between items-center pb-3 border-b border-slate-200 mb-4">
                <h3 class="text-xl font-black text-emerald-950 flex items-center space-x-2">
                    <i data-lucide="file-spreadsheet" class="text-emerald-700"></i>
                    <span>Importar Planilha Simplificada</span>
                </h3>
                <button onclick="fecharModalImportacao()" class="text-slate-400 hover:text-rose-600 p-1">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>

            <div class="space-y-4">
                <div class="bg-emerald-50 p-3 rounded-lg border border-emerald-200 text-xs text-emerald-950 space-y-1">
                    <p class="font-bold">Cabeçalho exigido no arquivo CSV:</p>
                    <code class="block bg-white p-2 rounded border border-emerald-200 font-mono text-[11px] text-emerald-900 mt-1">
                        nome, turma, turno, responsavel, telefone, endereco
                    </code>
                </div>

                <div>
                    <label class="block text-xs font-bold text-emerald-900 uppercase mb-1">Selecione o arquivo CSV</label>
                    <input type="file" id="arquivoCsv" accept=".csv" class="w-full text-xs border border-slate-300 p-2 rounded-lg">
                </div>

                <div id="statusImportacao" class="text-xs text-center font-bold hidden"></div>

                <div class="flex space-x-3 pt-3">
                    <button type="button" onclick="fecharModalImportacao()" class="w-1/2 bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold py-2.5 rounded-lg transition">
                        Cancelar
                    </button>
                    <button type="button" onclick="processarArquivoCSV()" id="btnProcessarCsv" class="w-1/2 bg-emerald-800 hover:bg-emerald-900 text-amber-300 font-bold py-2.5 rounded-lg transition shadow-md border border-amber-400/30">
                        Importar Dados
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- FIREBASE SDKs & LÓGICA -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCvWQzQ-_cpk_H_b8SGxX9So0ka05uWRxQ",
            authDomain: "carometro-escola.firebaseapp.com",
            projectId: "carometro-escola",
            storageBucket: "carometro-escola.firebasestorage.app",
            messagingSenderId: "906506245125",
            appId: "1:906506245125:web:79331da221fd8ed207386c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let usuarioLogado = null;
        let alunos = [];
        let usuarios = [];

        window.handleLogin = handleLogin;
        window.logout = logout;
        window.trocarAba = trocarAba;
        window.abrirModalImportacao = abrirModalImportacao;
        window.fecharModalImportacao = fecharModalImportacao;
        window.processarArquivoCSV = processarArquivoCSV;
        window.renderizarAlunos = renderizarAlunos;
        window.carregarDadosNuvem = carregarDadosNuvem;

        document.addEventListener("DOMContentLoaded", async () => {
            lucide.createIcons();
            await carregarDadosNuvem();
            verificarSessao();
        });

        async function carregarDadosNuvem() {
            try {
                const queryAlunos = await getDocs(collection(db, "alunos"));
                alunos = [];
                queryAlunos.forEach((doc) => alunos.push(doc.data()));

                const queryUsuarios = await getDocs(collection(db, "usuarios"));
                usuarios = [];
                queryUsuarios.forEach((doc) => usuarios.push(doc.data()));

                popularFiltrosTurmas();
                renderizarAlunos();
            } catch (e) {
                console.error("Erro ao carregar do Firebase:", e);
            }
        }

        function verificarSessao() {
            const sessao = localStorage.getItem("diario_bordo_sessao");
            if (sessao) {
                usuarioLogado = JSON.parse(sessao);
                exibirDashboard();
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const userIn = document.getElementById("loginUsername").value.trim().toLowerCase();
            const passIn = document.getElementById("loginPassword").value.trim();

            // 1. Tenta autenticar pelo banco do Firebase
            let user = usuarios.find(u => 
                String(u.username).trim().toLowerCase() === userIn && 
                String(u.senha).trim() === passIn
            );

            // 2. Fallback de segurança se o Firebase não tiver o usuário admin cadastrado
            if (!user && (userIn === "admin" && (passIn === "admin" || passIn === "admin123"))) {
                user = { username: "admin", perfil: "admin" };
            }

            if (user) {
                usuarioLogado = user;
                localStorage.setItem("diario_bordo_sessao", JSON.stringify(user));
                document.getElementById("loginError").classList.add("hidden");
                exibirDashboard();
            } else {
                const errDiv = document.getElementById("loginError");
                errDiv.innerText = "Usuário ou senha incorretos.";
                errDiv.classList.remove("hidden");
            }
        }

        function logout() {
            localStorage.removeItem("diario_bordo_sessao");
            usuarioLogado = null;
            document.getElementById("appDashboard").classList.add("hidden");
            document.getElementById("headerControls").classList.add("hidden");
            document.getElementById("loginSection").classList.remove("hidden");
            document.getElementById("loginForm").reset();
        }

        function exibirDashboard() {
            document.getElementById("loginSection").classList.add("hidden");
            document.getElementById("appDashboard").classList.remove("hidden");
            document.getElementById("headerControls").classList.remove("hidden");

            document.getElementById("userDisplayName").innerText = usuarioLogado.username;
            document.getElementById("userDisplayRole").innerText = usuarioLogado.perfil;

            const editorBtns = document.querySelectorAll(".editor-or-admin");
            editorBtns.forEach(el => {
                if (usuarioLogado.perfil === "admin" || usuarioLogado.perfil === "editor") el.classList.remove("hidden");
                else el.classList.add("hidden");
            });

            renderizarAlunos();
        }

        function trocarAba(aba) {
            document.getElementById("secTurmas").classList.remove("hidden");
        }

        function popularFiltrosTurmas() {
            const turmasSet = new Set(alunos.map(a => a.turma).filter(Boolean));
            const selectTurma = document.getElementById("filterTurma");

            selectTurma.innerHTML = '<option value="">Todas as Turmas</option>';

            Array.from(turmasSet).sort().forEach(t => {
                selectTurma.innerHTML += `<option value="${t}">${t}</option>`;
            });
        }

        function renderizarAlunos() {
            const fTurma = document.getElementById("filterTurma").value;
            const fTurno = document.getElementById("filterTurno").value;
            const fSearch = document.getElementById("searchAluno").value.toLowerCase();

            const filtrados = alunos.filter(a => {
                if (fTurma && a.turma !== fTurma) return false;
                if (fTurno && a.turno !== fTurno) return false;
                if (fSearch && !a.nome.toLowerCase().includes(fSearch)) return false;
                return true;
            });

            document.getElementById("gridAlunos").innerHTML = filtrados.map(a => criarCardHTML(a)).join("");
            lucide.createIcons();
        }

        function criarCardHTML(aluno) {
            return `
                <div class="bg-white rounded-xl border border-slate-200 p-4 shadow-sm hover:shadow-md transition flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-start mb-2">
                            <span class="bg-emerald-100 text-emerald-900 font-extrabold text-xs px-2.5 py-1 rounded-md">Turma ${aluno.turma}</span>
                            <span class="text-xs font-bold ${aluno.turno === 'Manhã' ? 'text-amber-600' : 'text-blue-600'} bg-slate-100 px-2 py-0.5 rounded">${aluno.turno || 'Não informado'}</span>
                        </div>

                        <h4 class="font-extrabold text-slate-900 text-base leading-snug mb-3">${aluno.nome}</h4>

                        <div class="space-y-1.5 text-xs text-slate-600 border-t border-slate-100 pt-2">
                            <p class="flex items-center space-x-1.5">
                                <i data-lucide="user" class="w-3.5 h-3.5 text-emerald-700"></i>
                                <span><strong>Resp:</strong> ${aluno.responsavel || 'Não informado'}</span>
                            </p>
                            <p class="flex items-center space-x-1.5">
                                <i data-lucide="phone" class="w-3.5 h-3.5 text-emerald-700"></i>
                                <span><strong>Tel:</strong> ${aluno.telefone || 'Não informado'}</span>
                            </p>
                            <p class="flex items-start space-x-1.5">
                                <i data-lucide="map-pin" class="w-3.5 h-3.5 text-emerald-700 mt-0.5"></i>
                                <span><strong>End:</strong> ${aluno.endereco || 'Não informado'}</span>
                            </p>
                        </div>
                    </div>
                </div>
            `;
        }

        function abrirModalImportacao() {
            document.getElementById("arquivoCsv").value = "";
            document.getElementById("statusImportacao").classList.add("hidden");
            document.getElementById("modalImportar").classList.remove("hidden");
        }

        function fecharModalImportacao() {
            document.getElementById("modalImportar").classList.add("hidden");
        }

        async function processarArquivoCSV() {
            const input = document.getElementById("arquivoCsv");
            const statusDiv = document.getElementById("statusImportacao");

            if (!input.files || !input.files[0]) {
                alert("Por favor, selecione um arquivo CSV.");
                return;
            }

            const file = input.files[0];
            const reader = new FileReader();

            statusDiv.className = "text-xs text-center font-bold text-amber-700 block";
            statusDiv.innerText = "Lendo planilha e importando...";

            reader.onload = async function(e) {
                const texto = e.target.result;
                const linhas = texto.split(/\r\n|\n/);

                if (linhas.length <= 1) {
                    alert("O arquivo está vazio ou em formato inválido.");
                    statusDiv.classList.add("hidden");
                    return;
                }

                const delimitador = linhas[0].includes(";") ? ";" : ",";
                const cabecalho = linhas[0].split(delimitador).map(c => c.trim().toLowerCase().replace(/"/g, ''));

                let contSucesso = 0;

                for (let i = 1; i < linhas.length; i++) {
                    if (!linhas[i].trim()) continue;
                    
                    const colunas = linhas[i].split(delimitador).map(c => c.trim().replace(/"/g, ''));
                    const dados = {};

                    cabecalho.forEach((nomeColuna, index) => {
                        dados[nomeColuna] = colunas[index] || "";
                    });

                    if (dados.nome && dados.turma) {
                        const id = "aluno_" + Date.now() + "_" + i;

                        const novoAluno = {
                            id: id,
                            nome: dados.nome,
                            turma: dados.turma,
                            turno: dados.turno || "Manhã",
                            responsavel: dados.responsavel || "",
                            telefone: dados.telefone || "",
                            endereco: dados.endereco || ""
                        };

                        await setDoc(doc(db, "alunos", id), novoAluno);
                        contSucesso++;
                    }
                }

                statusDiv.className = "text-xs text-center font-bold text-emerald-700 block";
                statusDiv.innerText = `${contSucesso} alunos importados com sucesso!`;

                setTimeout(async () => {
                    await carregarDadosNuvem();
                    fecharModalImportacao();
                }, 1500);
            };

            reader.readAsText(file, "UTF-8");
        }
    </script>
</body>
</html>
